# MQTT over TLS, broker-authenticates-itself only (no client cert required).
# Run: sudo mosquitto -c broker/tls-8883.conf -d
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous true
cafile /etc/mosquitto/ca_certificates/lab-ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile /etc/mosquitto/certs/broker.key
require_certificate false
log_dest file /var/log/mosquitto/fxr60-tls.log
log_type all
