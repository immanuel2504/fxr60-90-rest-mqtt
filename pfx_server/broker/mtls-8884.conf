# MQTT over TLS with mutual TLS - client must present a cert signed by the lab CA.
# Run: sudo mosquitto -c broker/mtls-8884.conf -d
listener 8884 0.0.0.0
protocol mqtt
allow_anonymous true
cafile /etc/mosquitto/ca_certificates/lab-ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile /etc/mosquitto/certs/broker.key
require_certificate true
use_identity_as_username true
log_dest file /var/log/mosquitto/fxr60-mtls.log
log_type all
