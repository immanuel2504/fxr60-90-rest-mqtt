<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FXR60 / FXR90 REST API Documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    @media (prefers-color-scheme: dark) {
      html { color-scheme: dark; }
      body { background: #1b1f2a; }
      .swagger-ui,
      .swagger-ui .info,
      .swagger-ui .info .title,
      .swagger-ui .info p,
      .swagger-ui .info li,
      .swagger-ui .info h1,
      .swagger-ui .info h2,
      .swagger-ui .info h3,
      .swagger-ui .markdown,
      .swagger-ui .markdown p,
      .swagger-ui .markdown li,
      .swagger-ui .renderedMarkdown,
      .swagger-ui .renderedMarkdown p,
      .swagger-ui .renderedMarkdown li,
      .swagger-ui .opblock-description,
      .swagger-ui .opblock-description-wrapper p,
      .swagger-ui .opblock-description-wrapper li,
      .swagger-ui .opblock .opblock-section-header h4,
      .swagger-ui .opblock .opblock-summary-description,
      .swagger-ui .opblock-title_normal,
      .swagger-ui .parameter__name,
      .swagger-ui .parameter__type,
      .swagger-ui .parameter__deprecated,
      .swagger-ui .parameter__in,
      .swagger-ui .tab li,
      .swagger-ui label,
      .swagger-ui .model-title,
      .swagger-ui .model,
      .swagger-ui .prop-type,
      .swagger-ui .response-col_status,
      .swagger-ui .response-col_description,
      .swagger-ui .response-col_links,
      .swagger-ui table thead tr th,
      .swagger-ui table tbody tr td,
      .swagger-ui .markdown table td,
      .swagger-ui .markdown table th,
      .swagger-ui .renderedMarkdown table td,
      .swagger-ui .renderedMarkdown table th {
        color: #e8eaed !important;
        background: transparent !important;
        border-color: #3d4454 !important;
      }
      .swagger-ui .opblock-section-header {
        background: #232836;
      }
      .swagger-ui .scheme-container,
      .swagger-ui .wrapper {
        background: transparent;
      }
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js" crossorigin></script>
  <script>
    window.onload = function () {
      window.ui = SwaggerUIBundle({
        url: "../FXR_60-90_rest_api.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout"
      });
    };
  </script>
</body>
</html>
