  /cloud/displayConfig:
    get:
      tags:
      - Display
      summary: Retrieves display configuration
      description: '## 1. Description


        > **Product applicability: FXR60 only.** Display APIs are not available on FXR90.


        The `GET /cloud/displayConfig` REST endpoint retrieves the currently active display configuration from the device.


        This endpoint returns:


        - Whether the display is enabled

        - On-screen keyboard, start URL, resolution, idle timeout, orientation, and keyboard layout


        No request body is required.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | REST Endpoint | `GET /cloud/displayConfig` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 only — not FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Related Endpoint | `PUT /cloud/displayConfig` |

        | MQTT Command | `get_displayConfig` |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/displayConfig` to read the display settings last applied with `PUT /cloud/displayConfig`.


        Key fields to check in the response:


        | Field | What to Check | Why It Matters |

        |---|---|---|

        | `enable` | Is the display on? | `false` means the display is disabled. |

        | `enableOnscreenKeyboard` | Is the virtual touch keyboard on? | Needed when no physical keyboard is attached. |

        | `startUrl` | Which URL is loaded? | Confirms the kiosk or local UI target. |

        | `resolution` | Is it `WidthxHeight` as expected? | Must match a resolution the monitor supports. |

        | `screenTimeoutSec` | Idle timeout, or `0` for always on | `0` keeps the screen awake; maximum is 3600 seconds. |

        | `orientation` | `landscape`, `portrait`, or a flipped variant | Controls how content is rotated. |

        | `keyboardLayout` | Layout such as `Japanese` or `English-US` | Should match the attached keyboard when one is present. |

        '
      operationId: getDisplayConfig
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDisplayConfigResponse'
              example:
                enable: true
                enableOnscreenKeyboard: true
                keyboardLayout: English-US
                orientation: landscape
                resolution: 1920x1080
                screenTimeoutSec: 0
                startUrl: https://localhost/
      security:
      - bearerAuth: []
    put:
      tags:
      - Display
      summary: Sets display configuration
      description: '## 1. Description


        > **Product applicability: FXR60 only.** Display APIs are not available on FXR90.


        The `PUT /cloud/displayConfig` REST endpoint sets display configuration on the device.


        This endpoint allows you to configure:


        - `enable` — enable or disable the display

        - `enableOnscreenKeyboard` — enable or disable the virtual touch on-screen keyboard

        - `startUrl` — URL opened when the display is enabled

        - `resolution` — configured display resolution (`WidthxHeight`)

        - `screenTimeoutSec` — screen timeout in seconds (`0`–`3600`; `0` keeps the display always on)

        - `orientation` — rotation of the screen content (`landscape`, `portrait`, `landscape-flipped`, `portrait-flipped`)

        - `keyboardLayout` — physical keyboard layout


        `resolution` and `screenTimeoutSec` are optional. If omitted, the reader uses the preferred resolution and a timeout of **300 seconds**.


        All other request fields are also optional. Send only the settings you want to change.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | REST Endpoint | `PUT /cloud/displayConfig` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 only — not FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Related Endpoint | `GET /cloud/displayConfig` |

        | MQTT Command | `set_displayConfig` |


        ## 3. Before You Begin


        | What You Need | Details |

        |---|---|

        | Enable | `true` turns the display on; `false` turns it off. |

        | Start URL | URL opened when the display is enabled, for example `https://localhost/`. |

        | Resolution | Optional. `WidthxHeight`, for example `1920x1080`. If omitted, the preferred resolution is used. Confirm supported modes with `GET /cloud/inputOutputDevices`. |

        | Idle timeout | Optional. `screenTimeoutSec`: `0` for always on, maximum `3600` (1 hour). If omitted, the default is `300`. |

        | Orientation | `landscape`, `portrait`, `landscape-flipped`, or `portrait-flipped`. |

        | Keyboard layout | One of `English-US`, `English-UK`, `German`, `Spanish`, `Italian`, `French`, `Brazilian`, `Swedish`, `Japanese`. |


        A successful REST response is an empty JSON object `{}`.


        Use `GET /cloud/inputOutputDevices` to confirm a monitor is connected and which resolutions it supports before setting `resolution`.

        '
      operationId: setDisplayConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDisplayConfigRequest'
            example:
              enable: true
              enableOnscreenKeyboard: true
              startUrl: https://localhost/
              resolution: 1920x1080
              orientation: landscape
              screenTimeoutSec: 300
              keyboardLayout: Japanese
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetDisplayConfigResponse'
              example: {}
      security:
      - bearerAuth: []
  /cloud/inputOutputDevices:
    get:
      tags:
      - Display
      summary: Retrieves input/output device information
      description: '## 1. Description


        > **Product applicability: FXR60 only.** Display APIs are not available on FXR90.


        The `GET /cloud/inputOutputDevices` REST endpoint retrieves the connection status and capabilities of input/output devices attached to the reader.


        This endpoint returns:


        - Keyboard status and active layout

        - Mouse and touch connection status

        - Monitor status, including hardware details and capabilities


        `monitor` shows the connected monitor''s detailed capabilities and hardware information.


        `screenActive` indicates whether the display screen is currently awake, or blanked because of screen timeout.


        No request body is required.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | REST Endpoint | `GET /cloud/inputOutputDevices` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 only — not FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Related Endpoint | `GET /cloud/displayConfig` |

        | MQTT Command | `get_inputOutputDevices` |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/inputOutputDevices` to:


        - Confirm a keyboard, mouse, touch screen, or monitor is connected

        - Read supported monitor resolutions before calling `PUT /cloud/displayConfig`

        - Check whether the monitor is awake (`screenActive: true`) or blanked by screen timeout


        Key fields to check in the response:


        | Field | What to Check | Why It Matters |

        |---|---|---|

        | `keyboard.status` / `mouse.status` / `touch.status` / `monitor.status` | `connected` or `disconnected` | Tells you which peripherals are present. |

        | `keyboard.keyboardLayout` | Active layout such as `Japanese` | Should match `displayConfig.keyboardLayout` when a keyboard is attached. |

        | `monitor.details[].currentResolution` | Active `WidthxHeight` | Compare with `GET /cloud/displayConfig` `resolution`. |

        | `monitor.details[].supportedResolutions` | List of modes the hardware allows | Use a value from this list in `PUT /cloud/displayConfig`. |

        | `monitor.details[].screenActive` | Awake vs blanked | `false` means the panel is blanked because of screen timeout. |

        '
      operationId: getInputOutputDevices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetInputOutputDevicesResponse'
              example:
                keyboard:
                  keyboardLayout: English-US
                  status: disconnected
                monitor:
                  details:
                  - currentResolution: 1920x1080
                    manufacturer: MST
                    model: XENARC
                    orientation: landscape
                    screenActive: true
                    supportedResolutions:
                    - 1280x720
                    - 1920x1080
                    - 1024x768
                    - 800x600
                    - 720x576
                    - 720x480
                    - 640x480
                  status: connected
                mouse:
                  status: disconnected
                touch:
                  status: disconnected
      security:
      - bearerAuth: []
  /cloud/app-led:
    get:
      tags:
      - App-led
      summary: Retrieves application LED state
      description: '## 1. Description


        The `GET /cloud/app-led` REST endpoint retrieves the current state of the application LED on the reader.


        This endpoint returns:


        - The application LED status (`DEFAULT` or `NON_DEFAULT`)


        No request body is required.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_appled` |

        | REST Endpoint | `GET /cloud/app-led` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/app-led` to:


        - Confirm whether the application LED is showing default reader state or has been overridden

        - Verify the effect of a prior `PUT /cloud/app-led` call

        - Audit LED state as part of a device health or provisioning check


        Key fields to check in the response:


        | Field | What to Check | Why It Matters |

        |---|---|---|

        | `status` | Is it `DEFAULT` or `NON_DEFAULT`? | `NON_DEFAULT` indicates the LED has been overridden by the application; `DEFAULT` means it reflects normal reader status. |

        '
      operationId: getAppled
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAppledResponse'
              examples:
                default_state:
                  summary: Reader controls LED
                  value:
                    status: DEFAULT
                non_default_state:
                  summary: non default state
                  value:
                    status: NON_DEFAULT
                overridden_state:
                  summary: App controls LED
                  value:
                    status: NON_DEFAULT
      security:
      - bearerAuth: []
    put:
      tags:
      - App-led
      summary: Updates application LED state
      description: '## 1. Description


        The `PUT /cloud/app-led` REST endpoint sets the color, flash behavior, and duration of the application LED on the reader.


        This endpoint allows you to configure:


        - The LED color through `color`

        - Whether the LED flashes through `flash`

        - How long the LED state persists through `seconds`


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `set_appled` |

        | Pattern Name | Application LED Control |

        | REST Endpoint | `PUT /cloud/app-led` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Supported Colors | `red`, `amber`, `green`, `off` |

        | Required Request Fields | `color`, `flash`, `seconds` |


        ## 3. Before You Begin


        Decide on the LED color, flash behavior, and duration before sending this request.


        | What You Need | Details |

        |---|---|

        | LED color | Required. One of `red`, `amber`, `green`, or `off` to turn the LED off. |

        | Flash behavior | Required. Whether the LED should blink (`true`) or remain solid (`false`). |

        | Duration | Required. How long in seconds the LED state should persist. Set to `0` for indefinite (until the next `PUT /cloud/app-led` request). |

        '
      operationId: setAppled
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAppledRequest'
            examples:
              amber_flash_60s:
                summary: Amber flash 60 seconds
                value:
                  color: amber
                  flash: true
                  seconds: 60
              app_led:
                summary: app led
                value:
                  color: amber
                  flash: true
                  seconds: 60
              continuous_alarm:
                summary: continuous alarm
                value:
                  color: red
                  flash: true
                  seconds: 0
              green_solid_10s:
                summary: Green solid 10 seconds
                value:
                  color: green
                  flash: false
                  seconds: 10
              "off":
                summary: LED off
                value:
                  color: "off"
                  flash: false
                  seconds: 0
              red_flash_indefinite:
                summary: Red flash indefinite
                value:
                  color: red
                  flash: true
                  seconds: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetAppledResponse'
              example: ''
      security:
      - bearerAuth: []
  /cloud/stack-led:
    get:
      tags:
      - Stack-led
      summary: Retrieves stack LED state
      description: '## 1. Description


        > **Product applicability: FXR60 Premium only.** The stack LED (stack light) is an FXR60 Premium feature; it is not available on other FXR60 variants, and the FXR90.


        The `GET /cloud/stack-led` REST endpoint retrieves the current state of the stack LED on the reader.


        This endpoint returns:


        - Status (`DEFAULT` or `NON_DEFAULT`)

        - Color, brightness, flash state, configured duration, and remaining time


        No request body is required.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_stackled` |

        | REST Endpoint | `GET /cloud/stack-led` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | **FXR60 Premium** — not on other FXR60 variants; the FXR90 has no stack light |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/stack-led` to:


        - Confirm the current stack LED color, brightness, and flash state

        - Verify the effect of a prior `PUT /cloud/stack-led` call

        - Check how many seconds remain on a timed LED override

        '
      operationId: getStackled
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStackledResponse'
              examples:
                default_state:
                  summary: default state
                  value:
                    status: DEFAULT
                flashing_red_with_countdown:
                  summary: flashing red with countdown
                  value:
                    status: NON_DEFAULT
                    color: red
                    brightness: high
                    flash: true
                    seconds: 30
                    seconds_remaining: 18
                solid_green:
                  summary: solid green
                  value:
                    status: NON_DEFAULT
                    color: green
                    brightness: med
                    flash: false
                    seconds: 0
                    seconds_remaining: 0
      security:
      - bearerAuth: []
    put:
      tags:
      - Stack-led
      summary: Updates stack LED state
      description: '## 1. Description


        > **Product applicability: FXR60 Premium only.** The stack LED (stack light) is an FXR60 Premium feature; it is not available on other FXR60 variants, and the FXR90.


        The `PUT /cloud/stack-led` REST endpoint sets the reader stack LED to the specified color.


        Supported colors: `red`, `amber`, `green`, `blue`, `off`.


        Supported brightness: `low`, `med`, `high` (defaults to `low`).


        > Note on `blue`: `blue` is valid **here**, on the stack light. It is **not** a valid application LED colour — see `PUT /cloud/app-led`, whose colours are `red`, `amber`, `green`, `off`.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `set_stackled` |

        | REST Endpoint | `PUT /cloud/stack-led` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | **FXR60 Premium** — not on other FXR60 variants; the FXR90 has no stack light |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Required Request Fields | `color`, `flash`, `seconds` |


        ## 3. Request Body


        | Field | Type | Description |

        |---|---|---|

        | `color` | string | Required. LED color: `red`, `amber`, `green`, `blue`, or `off` |

        | `brightness` | string | Optional. `low`, `med`, or `high`. Defaults to `low`. |

        | `flash` | boolean | Required. Whether the LED should blink |

        | `seconds` | integer | Required. Duration in seconds; use `0` for indefinite |


        ## 4. When to Use This Endpoint


        Success (`200`) is an empty string. The request body is not returned.


        Use `PUT /cloud/stack-led` to:


        - Set a visual indicator on the reader stack LED

        - Temporarily override the default LED state with a timed color/flash pattern

        '
      operationId: setStackled
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStackledRequest'
            examples:
              amber_med_flash:
                summary: amber med flash
                value:
                  color: amber
                  brightness: med
                  flash: true
                  seconds: 15
              green_solid:
                summary: green solid
                value:
                  color: green
                  flash: false
                  seconds: 0
              red_high_alert:
                summary: red high alert
                value:
                  color: red
                  brightness: high
                  flash: true
                  seconds: 30
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetStackledResponse'
      security:
      - bearerAuth: []
  /cloud/gpo:
    get:
      tags:
      - Gpio
      summary: Retrieves the GPO status
      description: '## 1. Description


        The `GET /cloud/gpo` REST endpoint retrieves the current digital output state of all GPO (General Purpose Output) pins on the reader.


        This endpoint returns:


        - The current HIGH or LOW state of each GPO pin (pins 1–4)


        No request body is required.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_gpoStatus` |

        | REST Endpoint | `GET /cloud/gpo` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/gpo` to:


        - Verify the current state of GPO outputs before issuing a GPO control command

        - Troubleshoot whether an actuator or signaling device connected to a GPO pin is receiving the correct signal

        - Confirm the effect of a prior GPO set command


        Key fields to check in the response:


        | Field | What to Check | Why It Matters |

        |---|---|---|

        | `1` | Is GPO pin 1 HIGH or LOW? | Confirms whether the device driven by port 1 (e.g., a light or gate) is active. |

        | `2` | Is GPO pin 2 HIGH or LOW? | Confirms whether the device driven by port 2 is active. |

        | `3` | Is GPO pin 3 HIGH or LOW? | Confirms whether the device driven by port 3 is active. |

        | `4` | Is GPO pin 4 HIGH or LOW? | Confirms whether the device driven by port 4 is active. |

        '
      operationId: getGpoStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGpoStatusResponse'
              example:
                "1": LOW
                "2": LOW
                "3": LOW
                "4": LOW
      security:
      - bearerAuth: []
    put:
      tags:
      - Gpio
      summary: Updates GPO port state
      description: '## 1. Description


        The `PUT /cloud/gpo` REST endpoint sets the output state of a single General Purpose Output (GPO) pin on the reader.


        This endpoint allows you to configure:


        - The target GPO port number through `port`

        - The desired output state through `state` (boolean: `true` = HIGH, `false` = LOW)


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `set_gpo` |

        | Pattern Name | GPO Control |

        | REST Endpoint | `PUT /cloud/gpo` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Required Request Fields | `port`, `state` |

        | Supported Port Values | 1-4 (varies by reader model - see `GET /cloud/readerCapabilities`) |


        ## 3. Before You Begin


        Know the port number and desired output state before sending this request. Setting a port beyond the reader''s capacity will result in an error.


        | What You Need | Details |

        |---|---|

        | Port number | The GPO port to target (integer, 1-4). Use `GET /cloud/readerCapabilities` to confirm the maximum number of GPO pins available on this reader model. |

        | Output state | `state` (boolean): `true` to drive the pin HIGH (active), `false` to drive the pin LOW (inactive). |

        | External device wiring | Confirm the wired device is rated for the GPO pin''s voltage and current output before asserting a HIGH state. |

        '
      operationId: setGpo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGpoRequest'
            example:
              port: 3
              state: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetGpoResponse'
              example: ''
      security:
      - bearerAuth: []
  /cloud/gpi:
    get:
      tags:
      - Gpio
      summary: Get GPI Status
      description: '## 1. Description


        The `GET /cloud/gpi` REST endpoint retrieves the current digital input state of all GPI (General Purpose Input) pins on the reader.


        This endpoint returns:


        - The current HIGH or LOW state of each GPI pin (pins 1-4)


        No request body is required.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_gpiStatus` |

        | REST Endpoint | `GET /cloud/gpi` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/gpi` to:


        - Check the current digital state of trigger or sensor inputs connected to GPI pins

        - Verify GPI pin state before applying a GPI-triggered workflow

        - Troubleshoot whether an external trigger signal is being received at the reader


        Key fields to check in the response:


        | Field | What to Check | Why It Matters |

        |---|---|---|

        | `1` | Is GPI pin 1 HIGH or LOW? | Confirms whether the wired sensor or trigger on port 1 is currently active. |

        | `2` | Is GPI pin 2 HIGH or LOW? | Confirms whether the wired sensor or trigger on port 2 is currently active. |

        | `3` | Is GPI pin 3 HIGH or LOW? | Confirms whether the wired sensor or trigger on port 3 is currently active. |

        | `4` | Is GPI pin 4 HIGH or LOW? | Confirms whether the wired sensor or trigger on port 4 is currently active. |

        '
      operationId: getGPIStatus
