                        ssidPassword: "12345678"
                wan_fxr90:
                  summary: FXR90 WAN (wan0) — esim with apn — not on FXR60
                  value:
                    hostName: FXR90C5F1AB
                    networkInterface:
                      wan0:
                        Status: offline
                        activeSim: esim
                        esim:
