                INVENTORY:
                  summary: 'Response: INVENTORY mode (verbose true — full configuration including defaults)'
                  value:
                    antennaStopCondition:
                      type: DURATION
                      value: 100
                    antennas:
                    - 1
                    - 2
                    delayAfterSelects: 0
                    delayBetweenAntennaCycles:
                      duration: 0
