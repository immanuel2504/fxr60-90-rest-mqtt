      type: object
      properties:
        scanType:
          type: array
          description: Which scan types to start. Omit for RFID-only (default).
          items:
            type: string
            enum:
            - ble
            - rfid
          minItems: 1
          uniqueItems: true
        doNotPersistState:
          type: boolean
          description: Controls whether the started inventory state is persisted across reboot. If `true`, the state is not persisted and auto-start is not enabled after reboot. If `false`, the state is persisted across reboot, enabling auto-start.
        applyImpinjGen2X:
          type: boolean
          description: 'When true, applies the previously configured Impinj Gen2X features (FastID, TagProtect, TagFocus, TagQuieting) on this start only. After stop, send true again. Cannot be used with `scanType: ["ble"]`.'
