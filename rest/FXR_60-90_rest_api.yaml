                issuerName: FXR609BE34A
                name: Server
                publickey: '-----BEGIN PUBLIC KEY-----

                  MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAtbQdN/YJqakTE02f81An

                  qQU3ahfB+HA750GjwyfW6LCO4PcfnkFG6bJD/8dPNg0lH5MZSoJm8ihJPffNHDLl

                  uar3t/faBbP3TAUBBRK5gBvtHpbwtZtJXJInPKU0MkUl3Xy5qmck8W0EAkv77UKw

                  ZnFqKCwJTRXRxwJo2TtqY3VIhO64IJDITLHajUBATJRnC9QKtJaWTS2n93e3Fecu

                  dy6e+Ed/demShfJoSVCRn35xFHVTfe46HpIG6iXfHdAW4I4/YsBs2kSHlWF9DfYA

                  KDva3YamdLIppOphLhsY5C0Y+SqyqKmOjQO4n7UdEvv2dsq3km4Gnp2h/Utzz2/W

                  VwIDAQAB

                  -----END PUBLIC KEY-----

                  '
                serial: "0x3039"
                subjectName: FXR609BE34A
                type: server
                validityEnd: 29/08/2046
                validityStart: 03/09/2026
      security:
      - bearerAuth: []
    put:
      tags:
      - Certificate
      summary: Install certificate
      description: '## 1. Description


        The `PUT /cloud/certificates` REST endpoint installs or updates a certificate on the reader by downloading a PFX file from a URL.


        This endpoint allows you to configure:


        - The certificate name assigned on the reader through `name`

        - The certificate type through `type`

        - The download source URL through `url`

        - The authentication method for the download server through `authenticationType`

        - BASIC credentials through `authenticationOptions`

        - The PFX file password through `pfxPassword`

        - Optional HTTPS download retry through `retry` and timeouts through `timeouts`

        - Optional file-server TLS checks through `verifyPeer`, `verifyHost`, and `CACertificateFileContent`


        **Synchronous vs asynchronous**


        - Omit `retry` — download and install finish during this call. The HTTP 200 body is the final result. HTTPS, FTPS, and SFTP.

        - Include `retry` with an `https://` URL — the reader acknowledges immediately and finishes in the background. The final success or failure is published on the management events channel. `retry.type` must be `randomWait`. Wait is a random duration between `retry.policy.wait.min` and `retry.policy.wait.max`.

        - Do not send `retry` or `timeouts` for `ftps://` or `sftp://`. Those protocols are synchronous only.


        `retry` and `timeouts` are HTTPS only.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `set_updateCertificate (set_update_cert)` |

        | Pattern Name | Certificate Installation |

        | REST Endpoint | `PUT /cloud/certificates` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Required Request Fields | `name`, `type`, `url` |

        | Supported Certificate Types | `client`, `server`, `app` |

        | Supported Transfer Protocols | `HTTPS`, `FTPS`, `SFTP` |

        | Supported Authentication Types | `BASIC` works on the reader. `NONE` is listed in the schema but is rejected (HTTP 422). |


        Live-tested on FXR60 reader application **5.0.7** (2026-09-05):


        - **Works:** `authenticationType: BASIC` with `authenticationOptions.username` / `password`. HTTP 200, empty body. GET `/cloud/certificates` then shows the installed name.

        - **Works:** same BASIC body plus `verifyPeer` / `verifyHost` and `CACertificateFileContent` when the file server does **not** require a client certificate.

        - **Does not work:** `authenticationType: NONE` — HTTP 422 `INVALID USER NAME`. The reader does not even fetch the URL.

        - **Does not work:** `headers.Authorization` Bearer — HTTP 422. Same misleading error. The reader does not fetch.

        - **Does not work:** `installedCertificateName` / `installedCertificateType` as download mTLS. The fields are accepted, but the reader does not present a client certificate when the server requires one.


        Use `authenticationOptions`, not `options`. Spec 11 still lists `options`; the reader accepts `authenticationOptions`.


        Published PUT examples are only the two SUCCESS bodies.


        ## 3. Before You Begin


        Gather all certificate source details before sending this request. An invalid URL, wrong certificate type, missing download credentials, or an incorrect PFX password will cause installation to fail.


        | What You Need | Details |

        |---|---|

        | Certificate name | A unique name to assign to this certificate on the reader. If a certificate with this name already exists, it will be replaced. |

        | Certificate type | `client` for mutual TLS authentication, `server` for CA/server trust, or `app` for application-specific certificates. |

        | Source URL | An `HTTPS`, `FTPS`, or `SFTP` URL where the reader can download the PFX certificate file. The reader must have network connectivity to reach this URL. |

        | Authentication type | Use `BASIC`. `NONE` is rejected on 5.0.5 and 5.0.7 even when the file server is anonymous. |

        | Download credentials | Required. Provide `authenticationOptions.username` and `authenticationOptions.password`. |

        | PFX password | The password protecting the PFX file (`pfxPassword`). Required if the PFX was exported with password protection. |

        | HTTPS retry | Optional. `retry.type` is `randomWait`. `retry.policy.retries` is 1–50. Wait seconds: `min` 0–3600, `max` 1–3600. Sending `retry` makes the install asynchronous. |

        | HTTPS timeouts | Optional. `timeouts.connection` and `timeouts.read` in seconds (1–3600). |

        | Server TLS check | Optional. `verifyPeer` / `verifyHost` plus `CACertificateFileContent` to validate the file server''s certificate. |

        '
      operationId: setUpdatecertificate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUpdatecertificateRequest'
            examples:
              basic_https:
                summary: Install client PFX over HTTPS with BASIC
                value:
                  name: TEST-BASIC-507
                  type: client
                  url: https://10.117.229.18/fxr60-lab-client.pfx
                  authenticationType: BASIC
                  authenticationOptions:
                    username: altautoadmin
                    password: '@1T@uT0dud3'
                  pfxPassword: Fxr60-Client-Pfx-2026!
                  verifyPeer: false
