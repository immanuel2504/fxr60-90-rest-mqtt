                    type: INVENTORY
      security:
      - bearerAuth: []
    put:
      tags:
      - Control
      summary: Updates the reader's operating mode
      description: '## 1. Description


        The `PUT /cloud/mode` REST endpoint configures the reader''s operating mode. The request body is an `operatingMode.v1` object.


        This call **replaces the entire mode configuration**. Fields you omit are not kept from the previous mode — send the full object you want the reader to use.


        This endpoint allows you to configure:


        - The operating mode type through `type`

        - Antenna port selection and transmit power through `antennas` and `transmitPower`

        - The RF environment profile through `environment`

        - Inventory stop behavior through `antennaStopCondition`

        - Gen2 query, select, and access settings

        - Report filtering, RSSI filtering, and metadata options


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `set_mode` |

        | Pattern Name | Operating Mode Configuration |

        | REST Endpoint | `PUT /cloud/mode` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Request Schema | `operatingMode.v1` |

        | Supported Mode Types | `SIMPLE`, `INVENTORY`, `PORTAL`, `CONVEYOR`, `CUSTOM` |

        | Supported Environment Profiles | `LOW_INTERFERENCE`, `HIGH_INTERFERENCE`, `VERY_HIGH_INTERFERENCE`, `AUTO_DETECT`, `DEMO` |


        ## 3. Before You Begin


        Decide on your mode configuration before sending this request. Changing mode while inventory is active can disrupt reads — call `PUT /cloud/stop` first if the reader is currently reading.


        | What You Need | Details |

        |---|---|

        | Mode type | One of `SIMPLE`, `INVENTORY`, `PORTAL`, `CONVEYOR`, or `CUSTOM`. |

        | Antenna ports and power | Which antenna ports to enable, and transmit power in **dBm** (0.0–30.0). |

        | Environment profile | Optional. Set to match the RF environment. Use `AUTO_DETECT` if unsure. Default is `HIGH_INTERFERENCE`. |

        | Mode-specific settings | Inventory interval for `INVENTORY`; GPI trigger (`port` 1–4) and stop interval for `PORTAL`. Include only the sub-object for the chosen type. |

        | Gen2 and reporting | Query, selects, optional accesses (`wordCount`, not `wordCounter`), metadata (`READERLOCATION`, not `READER_LOCATION`), report filter, RSSI filter, and radio start/stop conditions. |


        ## 4. Mode and field rules


        These rules match `operatingMode.v1`:


        | Rule | Detail |

        |---|---|

        | Wholesale replace | The new body replaces the previous mode. Omitted fields are not merged. |

        | `SIMPLE` | Do not send `tagMetaData`. Tag events include only `eventNum`, `format`, and `idHex`. |

        | `INVENTORY` | `accesses` is not allowed. Use `modeSpecificSettings.interval` to control how often each tag is reported. |

        | `PORTAL` | `radioStartConditions` and `radioStopConditions` are not allowed. GPI `port` is 1–4. |

        | Prefix `filter` | Cannot be set together with `query` or `selects`. |

        | `reportFilter` and `accesses` | Cannot both be set. |

        | Memory-bank metadata | `accesses` cannot be combined with `tagMetaData` values `RESERVED`, `EPC`, `TID`, or `USER`. |

        | Array lengths | When `transmitPower`, `antennaStopCondition`, or `query` is an array, its length must match `antennas`. |

        '
      operationId: setMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetModeRequest'
            examples:
              CONVEYOR:
                summary: CONVEYOR mode baseline
                value:
                  type: CONVEYOR
                  antennas:
                  - 1
                  - 2
                  - 3
                  - 4
                  transmitPower:
                  - 30
                  - 30
                  - 30
                  - 30
                  environment: HIGH_INTERFERENCE
                  antennaStopCondition:
                    type: DURATION
                    value: 100
                  query:
                    sel: ALL
                    session: S1
                    tagPopulation: 200
                    target: A
                  inventoryProtocol:
                    mode: GEN2
                  tagMetaData:
                  - ANTENNA
                  - RSSI
                  - SEEN_COUNT
                  - CHANNEL
              CUSTOM_accesses:
                summary: CUSTOM accesses
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  transmitPower:
                  - 30
                  query:
                    sel: ALL
                    session: S1
                    tagPopulation: 50
                    target: A
                  accesses:
                  - type: READ
                    config:
                      membank: TID
                      wordPointer: 0
                      wordCount: 6
                  tagMetaData:
                  - ANTENNA
                  - RSSI
              CUSTOM_filter:
                summary: CUSTOM filter
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  - 2
                  transmitPower: 27
                  filter:
                    value: E280
                    match: prefix
                    operation: include
              CUSTOM_metadata:
                summary: CUSTOM metadata
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  transmitPower: 27
                  tagMetaData:
                  - ANTENNA
                  - RSSI
                  - PHASE
                  - SEEN_COUNT
                  - CHANNEL
                  - PC
                  - XPC
                  - CRC
                  - EPC
                  - TID
                  - USER
                  - MAC
                  - HOSTNAME
                  - READERLOCATION
              CUSTOM_query:
                summary: CUSTOM query
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  transmitPower: 27
                  query:
                    sel: ALL
                    session: S1
                    tagPopulation: 256
                    target: A
              CUSTOM_radio_stop:
                summary: CUSTOM radio stop
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  - 2
                  transmitPower:
                  - 28
                  - 28
                  radioStopConditions:
                    duration: 60
              CUSTOM_report_filter:
                summary: CUSTOM report filter
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  - 2
                  transmitPower:
                  - 28
                  - 28
                  reportFilter:
                    duration: 5
                    type: PER_ANTENNA
              CUSTOM_selects:
                summary: CUSTOM selects
                value:
                  type: CUSTOM
                  antennas:
                  - 1
                  transmitPower:
                  - 30
                  query:
                    sel: NOT_SL
                    session: S1
                    tagPopulation: 10
                    target: A
                  selects:
                  - target: S1
                    action: INVB_NOTHING
                    membank: TID
                    pointer: 6
                    length: 24
                    mask: "800600"
              INVENTORY:
                summary: INVENTORY mode with report interval
                value:
                  type: INVENTORY
                  environment: HIGH_INTERFERENCE
                  antennas:
                  - 1
                  - 2
                  transmitPower:
                  - 27
                  - 27
                  modeSpecificSettings:
                    interval:
                      unit: seconds
                      value: 60
                  antennaStopCondition:
                    type: DURATION
                    value: 100
                  query:
                    sel: ALL
                    session: S1
                    tagPopulation: 256
                    target: A
                  inventoryProtocol:
                    mode: GEN2
                  delayBetweenAntennaCycles:
                    type: DISABLED
                    duration: 0
                  tagMetaData:
                  - ANTENNA
                  - RSSI
                  - SEEN_COUNT
                  - CHANNEL
              PORTAL:
                summary: PORTAL mode with GPI start trigger
                value:
                  type: PORTAL
                  antennas:
                  - 1
                  - 2
                  transmitPower: 30
                  environment: HIGH_INTERFERENCE
                  modeSpecificSettings:
                    startTrigger:
                      port: 1
                      signal: HIGH
                    stopInterval: 5
                  query:
                    sel: ALL
                    session: S1
                    tagPopulation: 100
                    target: A
                  inventoryProtocol:
                    mode: GEN2
                  tagMetaData:
                  - ANTENNA
                  - RSSI
                  - SEEN_COUNT
              SIMPLE:
                summary: SIMPLE mode baseline
                value:
                  type: SIMPLE
                  antennas:
                  - 1
                  - 2
                  - 3
                  - 4
                  transmitPower: 30
                  antennaStopCondition:
                    type: DURATION
                    value: 400
                  query:
                    sel: ALL
                    session: S2
                    tagPopulation: 2000
                    target: AB
                  inventoryProtocol:
                    mode: GEN2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetModeResponse'
      security:
      - bearerAuth: []
  /cloud/start:
    put:
      tags:
      - Control
      summary: Start RFID Inventory or BLE scan
      description: '## 1. Description


        The `PUT /cloud/start` REST endpoint starts RFID inventory, BLE scanning, or both on the reader.


        By default, an empty request body starts RFID inventory only. Use the flags below to start BLE, apply Gen2X, or control reboot persistence.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `start` |

        | Pattern Name | Scan Control - Start |

        | REST Endpoint | `PUT /cloud/start` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Request fields | `scanType` (array of `ble` / `rfid`), `applyImpinjGen2X`, `doNotPersistState` |

        | Firmware Requirement | BLE requires reader build **4.0.11** or later. On earlier builds the `scanType` field is not available. |


        ## 3. Before You Begin


        Make sure the relevant scanners are configured before sending this request.


        | What You Need | Details |

        |---|---|

        | HTTPS connectivity | The reader''s HTTPS endpoint must be reachable and a valid bearer token must be included in the `Authorization` header of every request. |

        | RFID configuration | Operating mode must be configured via `PUT /cloud/mode` (or left at the default) before starting RFID inventory. |

        | BLE configuration | If starting BLE, configure BLE first with `PUT /cloud/bleConfig` and `ble.enable: true`. The full `ble` object is required. |

        | Gen2X configuration | If using `applyImpinjGen2X: true`, save the Gen2X configuration with `PUT /cloud/impinjGen2X` first. `applyImpinjGen2X` cannot be combined with a BLE-only scan (`scanType: ["ble"]`). |


        ## 4. Supported flags


        | Flag | What it does |

        |---|---|

        | `scanType` | Which scanners to start. Array of `ble` and/or `rfid`. |

        | `applyImpinjGen2X` | Apply the Gen2X configuration saved with `PUT /cloud/impinjGen2X`. |

        | `doNotPersistState` | Do not resume RFID inventory after reboot. RFID only — BLE never auto-resumes. |


        ### `scanType`


        `scanType` is an **array** of scan types. Omit it for RFID-only (default). The array must be non-empty and must not contain duplicates.


        ```json

        { "scanType": ["ble"] }

        ```


        | Request body | Behavior |

        |---|---|

        | omitted / `{}` | Starts RFID inventory only (default). |

        | `["rfid"]` | Starts RFID inventory only. |

        | `["ble"]` | Starts BLE scanning only. Requires BLE to be enabled first. |

        | `["ble", "rfid"]` | Starts both scanners. |


        > Firmware requirement: BLE scanning — and with it the `scanType` field — is available from reader build **4.0.11** onward. On builds older than 4.0.11, omit `scanType`; `PUT /cloud/start` starts RFID inventory only. Check the installed build with `GET /cloud/version` (`readerApplication`).


        ### `applyImpinjGen2X`


        Send `applyImpinjGen2X: true` to apply the Gen2X features saved with `PUT /cloud/impinjGen2X` when RFID inventory starts.


        | Value | Behavior |

        |---|---|

        | omitted / `false` | Start without applying Gen2X. A saved Gen2X config is ignored until this flag is true. |

        | `true` | Apply the saved Gen2X config on **this** start only. After `PUT /cloud/stop`, send `true` again — activation does not persist across inventory sessions. Cannot be combined with `scanType: ["ble"]`. |


        ```json

        { "applyImpinjGen2X": true }

        ```


        ### Persistence across reboots (`doNotPersistState`)


        `doNotPersistState` applies to RFID only.


        | `doNotPersistState` | Behavior on reboot or reconnect |

        |---|---|

        | `false` (default) | The reader **remembers the running RFID inventory state** and automatically resumes it. |

        | `true` | The running state is **not saved**. The reader stays idle until `PUT /cloud/start` is called again. |


        > Use `doNotPersistState: true` for one-time or debugging sessions where automatic resume after reboot is not desired.

        '
      operationId: startInventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartInventoryRequest'
            examples:
              start_BLE_and_RFID:
                summary: Start BLE and RFID
                value:
                  scanType:
                  - ble
                  - rfid
              start_BLE_only:
                summary: Start BLE only
                value:
                  scanType:
                  - ble
              start_Inventory:
                summary: Start RFID inventory (default)
                value: {}
              start_Inventory with AutoStart:
                summary: Start inventory with AutoStart
                value:
                  doNotPersistState: false
              start_Inventory with ImpinjGen2X:
                summary: Start inventory with Impinj Gen2X
                value:
                  applyImpinjGen2X: true
              start_RFID_only:
                summary: Start RFID inventory (explicit)
                value:
                  scanType:
                  - rfid
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
  /cloud/stop:
    put:
      tags:
      - Control
      summary: Stop RFID Inventory or BLE scan
      description: '## 1. Description


        The `PUT /cloud/stop` REST endpoint stops RFID inventory, BLE scanning, or both.


        By default, if the request body is empty or `scanType` is not provided, the reader stops RFID inventory only.


        `scanType` is an **array** of scan types to stop. The array must be non-empty and must not contain duplicates.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `stop` |

        | Pattern Name | Scan Control - Stop |

        | REST Endpoint | `PUT /cloud/stop` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Content-Type | `application/json` |

        | Request fields | `scanType` (array of `ble` / `rfid`) |

        | Firmware Requirement | BLE requires reader build **4.0.11** or later. On earlier builds the `scanType` field is not available. |


        ## 3. Stop Behavior


        Omit `scanType` to stop RFID only (default).


        ```json

        { "scanType": ["ble"] }

        ```


        | Request body | Result |

        |---|---|

        | `{}` | Stops RFID inventory only. This is the default behavior. |

        | `{ "scanType": ["rfid"] }` | Stops RFID inventory. BLE scanning continues if active. |

        | `{ "scanType": ["ble"] }` | Stops BLE scanning. RFID inventory continues if active. |

        | `{ "scanType": ["ble", "rfid"] }` | Stops both. |


        Stop is **not** a no-op. Stopping a scan type that is not running returns **422** (`No scan is currently active`). Check `GET /cloud/status` first if you are not sure what is running.


        > Firmware requirement: BLE scanning — and with it the `scanType` field — is available from reader build **4.0.11** onward. On builds older than 4.0.11, send an empty body `{}`, which stops RFID inventory. Check the installed build with `GET /cloud/version` (`readerApplication`).


        ## 4. Before You Begin


        | What You Need | Details |

        |---|---|

        | Current activity | Check `GET /cloud/status` if you need to confirm RFID or BLE activity before stopping. |

        | Target scan type | Choose `rfid`, `ble`, or both in `scanType`. Omit `scanType` only when you want the default RFID stop. |

        '
      operationId: stopInventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopInventoryRequest'
            examples:
              stop_BLE_and_RFID:
                summary: Stop BLE and RFID
                value:
                  scanType:
                  - ble
                  - rfid
              stop_BLE_only:
                summary: Stop BLE only
                value:
                  scanType:
                  - ble
              stop_RFID_default:
                summary: Stop RFID (default)
                value: {}
              stop_RFID_explicit:
                summary: Stop RFID (explicit)
                value:
                  scanType:
                  - rfid
      responses:
        "200":
          description: OK
      security:
      - bearerAuth: []
  /cloud/version:
    get:
      tags:
      - System
      summary: Retrieves reader component version information
      description: '## 1. Description


        The `GET /cloud/version` REST endpoint retrieves detailed hardware and software component version information from the reader''s software stack.


        This endpoint returns:


        - Reader application, radio firmware, and cloud agent versions

        - Radio control application version

        - Reader model and serial number

        - Available OS upgrade paths (`availableOsUpgrades`; empty when none)

        - Firmware revert information (`revertBackFirmware`)


        No request body is required.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_version` |

        | Pattern Name | Version Query |

        | REST Endpoint | `GET /cloud/version` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Supported Operations | Retrieve firmware, model, serial number, and upgrade details |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/version` to:


        - Confirm the installed firmware versions before or after a system update

        - Verify the exact reader model when applying model-specific configuration

        - Capture the serial number for asset tracking, remote fleet management, or support cases

        - Audit whether a downloaded OS upgrade is waiting (`availableOsUpgrades`)


        Key fields to check in the response:


        | Field | What to Check | Why It Matters |

        |---|---|---|

        | `readerApplication` | Current reader software version | Determines which features and API operations are available. |

        | `radioFirmware` | Firmware running on the radio module | Affects RF behavior, read performance, and hardware compatibility. |

        | `cloudAgentApplication` | Cloud agent version | Governs device-to-cloud messaging behavior and cloud connectivity. |

        | `model` | `FXR90`, `FX7500`, `FX9600`, `ATR7000`, or `FXR60` | Drives physical capabilities and model-specific settings. |

        | `serialNumber` | Unique reader serial number | Identifies the device for support cases and asset records. |

        | `availableOsUpgrades` | Is the object empty or populated? | A populated object means a downloaded OS upgrade is ready to install. An empty object `{}` means none is waiting. |

        | `revertBackFirmware` | Object | Versions available for reverting the reader firmware. |

        '
      operationId: getVersion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVersionResponse'
              example:
                availableOsUpgrades: {}
                cloudAgentApplication: 0.6.2.64
                model: FXR60
                radioControlApplication: 0.2.58.7
                radioFirmware: 2.1.70.0
                readerApplication: 5.0.7
                revertBackFirmware: {}
                serialNumber: "260975251E0049"
      security:
      - bearerAuth: []
  /cloud/status:
    get:
      tags:
      - System
      summary: Retrieves reader operational statistics
      description: "## 1. Description\n\nThe `GET /cloud/status` REST endpoint retrieves operational statistics and health information from the reader at the moment of the request.\n\nThis endpoint returns:\n\n- Uptime and current system time\n- Radio connection and activity state\n- Reader temperature\n- CPU and RAM usage\n- Flash storage usage by partition\n- Antenna port connection states\n- NTP synchronization status\n- Cloud interface connection status\n- Power source and power-negotiation state\n- Active Impinj Gen2X feature status (when a Gen2X feature is running)\n- BLE scanner runtime status (scan state, scan start time, and beacon counts by protocol)\n\nThe `ble` section is present only when BLE is supported and its status is available. No request body is required.\n\n## 2. Endpoint Details\n\n| Property | Value |\n|---|---|\n| MQTT Command | `get_status` |\n| Pattern Name | Reader Status Query |\n| REST Endpoint | `GET /cloud/status` |\n| Communication Type | Client to Device (HTTP request/response) |\n| Applies To | FXR60 / FXR90 |\n| Authentication | Bearer token (`Authorization: Bearer <token>`) |\n| Supported Operations | Retrieve live operational statistics and health |\n\n## 3. When to Use This Endpoint\n\nUse `GET /cloud/status` to:\n\n- Confirm the reader is powered, healthy, and reachable\n- Verify the radio is connected before starting inventory\n- Monitor reader temperature for thermal issues\n- Synchronize against the reader's current system time\n- Check CPU, RAM, and flash usage during high-load scenarios\n- Confirm BLE scanning is active and review beacon counts by protocol\n\nKey fields to check in the response:\n\n| Field | What to Check | Why It Matters |\n|---|---|---|\n| `uptime` | How long has the reader been running? | Long uptimes confirm stability; short uptimes indicate an unexpected restart. |\n| `radioConnection` | Is the value `connected`? | Inventory cannot run if the radio is disconnected. |\n| `radioActivity` | Is it `active` or `inactive`? | Confirms whether an inventory session is currently in progress. |\n| `temperature` | Is the value within safe operating range? | Excessive temperature can cause throttling or hardware faults. |\n| `antennas` | Are expected ports `connected`? Only ports present on this reader are listed — not every reader has 8 antennas. | A `disconnected` antenna port means tags on that port will not be read. |\n| `ntp.offset` | Is the offset near zero? | A large NTP offset means event timestamps may be inaccurate. |\n| `ble.scanState` | Is the value `running`? | Confirms whether the BLE scanner is currently active (`running`) or `stopped`. |\n| `ble.scanStartTime` | When did the current scan start? | ISO 8601 timestamp marking when BLE scanning last started. |\n| `ble.beaconCounts` | Are advertisements being seen? | Per-protocol counts (`iBeacon`, `altBeacon`, `eddystone`, `generic`, `total`) confirm beacons are being detected in the current scan window. |\n| `impinjGen2X.feature` | Which Gen2X object is loaded (`fastID`, `tagProtect`, `tagFocus`, `tagQuieting`, or `none`)? | Names the last saved feature. `none` after stop or when Gen2X is not running. |\n| `impinjGen2X.isActive` | Is a Gen2X config running in this inventory session? | `true` means Gen2X was applied on this start. It does **not** mean FastID or TagFocus is switched on. `{\"fastID\":{\"enabled\":false}}` can still show `feature: fastID` and `isActive: true`. Use `GET /cloud/impinjGen2X` to read `enabled`. |\n\n## 4. BLE Status Fields\n\nWhen BLE is supported and active, the response includes a `ble` object:\n\n| Field | Type | Description |\n|---|---|---|\n| `ble.scanState` | string | Current BLE scanner state — `running` or `stopped`. |\n| `ble.scanStartTime` | string (date-time) | ISO 8601 timestamp of when the BLE scan was last started. |\n| `ble.beaconCounts.total` | integer | Total BLE advertisements observed in the current scan window. |\n| `ble.beaconCounts.iBeacon` | integer | Number of iBeacon advertisements observed. |\n| `ble.beaconCounts.altBeacon` | integer | Number of AltBeacon advertisements\
        \ observed. |\n| `ble.beaconCounts.eddystone` | integer | Number of Eddystone advertisements observed. |\n| `ble.beaconCounts.generic` | integer | Number of generic BLE advertisements observed. |\n\nExample `ble` section:\n\n```json\n\"ble\": {\n  \"scanState\": \"running\",\n  \"scanStartTime\": \"2026-05-21T13:46:16.955Z\",\n  \"beaconCounts\": {\n    \"total\": 108,\n    \"iBeacon\": 75,\n    \"altBeacon\": 33,\n    \"eddystone\": 0,\n    \"generic\": 0\n  }\n}\n```\n"
      operationId: getStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStatusResponse'
              example:
                antennas:
                  "1": connected
                  "2": disconnected
                  "3": disconnected
                  "4": disconnected
                  "5": connected
                  "6": connected
                ble:
                  beaconCounts:
                    altBeacon: 0
                    eddystone: 0
                    generic: 0
                    iBeacon: 0
                    total: 0
                  scanStartTime: ''
                  scanState: stopped
                cpu:
                  system: 0
                  user: 19
                flash:
                  platform:
                    free: 0
                    total: 0
                    used: 0
                  readerConfig:
                    free: 0
                    total: 0
                    used: 0
                  readerData:
                    free: 0
                    total: 0
                    used: 0
                  rootFileSystem:
                    free: 0
                    total: 0
                    used: 0
                impinjGen2X:
                  feature: none
                  isActive: false
                interfaceConnectionStatus:
                  data:
                  - connectionError: ''
                    connectionStatus: connected
                    description: Tag events (MQTT_MTLS)
                    interface: DATA_MQTT_MTLS
                ntp:
                  offset: 0.035904
                  reach: 213
                powerNegotiation: POE+
                powerSource: PWR_BRICK
                radioActivity: inactive
                radioConnection: connected
                ram:
                  free: 72
                  total: 100
                  used: 28
                systemTime: 05/09/2026 13:20
                temperature: 31
                uptime: 1D23H28M41S
      security:
      - bearerAuth: []
  /cloud/config:
    get:
      tags:
      - System
      summary: Retrieves reader configuration
      description: '## 1. Description


        The `GET /cloud/config` REST endpoint retrieves the reader''s full configuration, including RF settings, GPIO and LED defaults, and reader-gateway endpoint settings.


        This endpoint returns:


        - GPIO and LED trigger configuration (`GPIO-LED`), including GPO and LED defaults; returned as an empty object `{}` when unset (not the string `"NOT_CONFIGURED"`)

        - Reader-gateway settings including tag data retention, batching, and endpoint configuration


        No request body is required.


        ## 2. Endpoint Details


        | Property | Value |

        |---|---|

        | MQTT Command | `get_config` |

        | Pattern Name | Reader Configuration Query |

        | REST Endpoint | `GET /cloud/config` |

        | Communication Type | Client to Device (HTTP request/response) |

        | Applies To | FXR60 / FXR90 |

        | Authentication | Bearer token (`Authorization: Bearer <token>`) |

        | Supported Operations | Retrieve active reader configuration |


        ## 3. When to Use This Endpoint


        Use `GET /cloud/config` to:


        - Review the active configuration before calling `PUT /cloud/config`

        - Audit GPIO and LED default states across a fleet of readers

        - Inspect tag-data retention and batching settings

        - Confirm which data and management endpoints are configured


        Key fields to check in the response:


        | Field | What to Check | Why It Matters |

