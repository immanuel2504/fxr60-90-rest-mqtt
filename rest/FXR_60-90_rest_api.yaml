    LocalrestloginResponse:
      type: object
      properties:
        code:
          type: number
        message:
          type: string
    GetDisplayConfigResponse:
      type: object
      properties:
        enable:
          type: boolean
          description: Indicates if the display is enabled or disabled.
        enableOnscreenKeyboard:
          type: boolean
          description: Indicates if the virtual onscreen keyboard is enabled or disabled.
        startUrl:
          type: string
          description: The current URL loaded.
        resolution:
          type: string
          description: The currently active display resolution.
        screenTimeoutSec:
          type: integer
          description: Current screen idle timeout in seconds.
        orientation:
          type: string
          description: Current rotation of the screen content.
          enum:
          - landscape
          - portrait
          - landscape-flipped
          - portrait-flipped
        keyboardLayout:
          type: string
          description: Current physical layout of the keyboard.
          enum:
          - English-US
          - English-UK
          - German
          - Spanish
          - Italian
          - French
          - Brazilian
          - Swedish
          - Japanese
    SetDisplayConfigRequest:
      type: object
      properties:
        enable:
          type: boolean
          description: Turns the display rendering engine on (true) or off (false).
        enableOnscreenKeyboard:
          type: boolean
          description: Enable or disable the virtual touch onscreen keyboard.
        startUrl:
          type: string
          description: URL to be opened when the display is enabled.
        resolution:
          type: string
          description: Preferred monitor resolution in pixels(WidthxHeight).
        screenTimeoutSec:
          type: integer
          description: The amount of idle time in seconds before the screen goes to sleep, Use 0 for always on with maximum 3600 seconds(1 hour).
        orientation:
          type: string
          description: Controls the rotation of the screen content.
          enum:
          - landscape
          - portrait
          - landscape-flipped
          - portrait-flipped
        keyboardLayout:
          type: string
          description: The physical layout of the keyboard.
          enum:
          - English-US
          - English-UK
          - German
          - Spanish
          - Italian
          - French
          - Brazilian
          - Swedish
          - Japanese
    SetDisplayConfigResponse:
      type: object
      description: Empty success object.
    GetInputOutputDevicesResponse:
      type: object
      properties:
        keyboard:
          type: object
          properties:
            status:
              type: string
              enum:
              - connected
              - disconnected
            keyboardLayout:
              type: string
              description: The active physical keyboard layout.
              enum:
              - English-US
              - English-UK
              - German
              - Spanish
              - Italian
              - French
              - Brazilian
              - Swedish
              - Japanese
        mouse:
          type: object
          properties:
            status:
              type: string
              enum:
              - connected
              - disconnected
        touch:
          type: object
          properties:
            status:
              type: string
              enum:
              - connected
              - disconnected
        monitor:
          type: object
          properties:
            status:
              type: string
              enum:
              - connected
              - disconnected
            details:
              type: array
              description: A list containing hardware specifications for each connected monitor.
              items:
                type: object
                properties:
                  manufacturer:
                    type: string
                    description: Manufacturer name of the monitor.
                  model:
                    type: string
                    description: Model name of teh monitor.
                  currentResolution:
                    type: string
                    description: The currently active display resolution.
                  screenActive:
                    type: boolean
                    description: Indicates if the monitor is awake (true) or sleep (false).
                  orientation:
                    type: string
                    description: The current rotation of the screen content.
                    enum:
                    - landscape
                    - portrait
                    - landscape-flipped
                    - portrait-flipped
                  supportedResolutions:
                    type: array
                    description: A list of all resolutions supported by the monitor hardware.
                    items:
                      type: string
    GetAppledResponse:
      type: object
      properties:
        status:
          type: string
          description: Current state of the application LED.
          enum:
          - DEFAULT
          - NON_DEFAULT
    SetAppledRequest:
      type: object
      required:
      - color
      - flash
      - seconds
      properties:
        color:
          type: string
          description: The color of the LED (red, amber, green, off).
          enum:
          - red
          - amber
          - green
          - "off"
        flash:
          type: boolean
          description: Whether the LED should blink.
        seconds:
          type: number
          description: Duration in seconds. Use 0 for indefinite.
    SetAppledResponse:
      type: string
      description: Returns an empty string on success.
    GetStackledResponse:
      type: object
      properties:
        status:
          type: string
        color:
          type: string
        brightness:
          type: string
        flash:
          type: boolean
        seconds:
          type: integer
        seconds_remaining:
          type: integer
    SetStackledRequest:
      type: object
      required:
      - color
      - flash
      - seconds
      properties:
        color:
          type: string
          description: The color of the LED (red, amber, green, blue, off)
          enum:
          - red
          - amber
          - green
          - blue
          - "off"
        brightness:
          type: string
          description: The brightness of the LED (low, med, high). Defaults to low.
          enum:
          - low
          - med
          - high
        flash:
          type: boolean
        seconds:
          type: integer
    SetStackledResponse:
      type: string
      description: Returns an empty string on success.
    GetGpoStatusResponse:
      type: object
      properties:
        "1":
          type: string
          enum:
          - HIGH
          - LOW
        "2":
          type: string
          enum:
          - HIGH
          - LOW
        "3":
          type: string
          enum:
          - HIGH
          - LOW
        "4":
          type: string
          enum:
          - HIGH
          - LOW
    SetGpoRequest:
      type: object
      required:
      - port
      - state
      properties:
        port:
          type: number
          description: GPO port number (1–4 for FXR90; device-specific maximum applies).
          minimum: 1
          maximum: 4
        state:
          type: boolean
          description: Desired GPO state — true for HIGH, false for LOW.
    SetGpoResponse:
      type: string
      description: Returns an empty string on success.
    GetGPIStatusResponse:
      type: object
      required:
      - "1"
      - "2"
      - "3"
      - "4"
      properties:
        "1":
          type: string
          description: GPI port 1 state reported by the reader.
          enum:
          - HIGH
          - LOW
        "2":
          type: string
          description: GPI port 2 state reported by the reader.
          enum:
          - HIGH
          - LOW
        "3":
          type: string
          description: GPI port 3 state reported by the reader.
          enum:
          - HIGH
          - LOW
        "4":
          type: string
          description: GPI port 4 state reported by the reader.
          enum:
          - HIGH
          - LOW
