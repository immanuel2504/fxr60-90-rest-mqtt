    GetImpinjGen2XResponse:
      type: object
      description: Current Impinj Gen2X feature as last saved via set_impinjGen2X. Exactly one feature object is present after any successful PUT. A later PUT replaces the previous object; this is not a merge. On a reader that has never been configured, the 200 body is empty (not JSON `{}`).
      maxProperties: 1
      properties:
        fastID:
          type: object
          description: FastID configuration. Present only if fastID was previously configured.
          properties:
            enabled:
              type: boolean
              description: Whether FastID is enabled.
          required:
          - enabled
        tagProtect:
          type: object
          description: TagProtect configuration. Present only if tagProtect was previously configured.
          properties:
            action:
              type: string
              description: Last configured protection action.
              enum:
              - enableTagProtection
              - disableTagProtection
              - enableTagVisibility
              - disableTagVisibility
            password:
              type: string
              description: 8-character hexadecimal 32-bit password.
              minLength: 8
              maxLength: 8
              pattern: ^[0-9A-Fa-f]{8}$
            tagID:
              type: string
              description: Hexadecimal tagID (EPC) of the target tag. Only present when action is enableTagProtection or disableTagProtection.
              pattern: ^[0-9A-Fa-f]+$
            enableShortRange:
              type: boolean
              description: Whether short-range protection mode is enabled.
          required:
          - action
          - password
        tagFocus:
          type: object
          description: TagFocus configuration. Present only if tagFocus was previously configured.
          properties:
            enabled:
              type: boolean
              description: Whether TagFocus is enabled.
          required:
          - enabled
        tagQuieting:
          $ref: '#/components/schemas/impinjTagQuieting.v1'
    GetImpinjGen2XResponse500:
      type: object
      properties:
        code:
          type: number
        message:
          type: string
    SetImpinjGen2XRequest:
      type: object
      description: Configures Impinj Gen2X proprietary features. Exactly one feature object (fastID, tagProtect, tagFocus, or tagQuieting) must be provided per request; combining any two or more features is rejected.
      minProperties: 1
      maxProperties: 1
      properties:
        fastID:
          type: object
          description: Impinj FastID embeds the tag TID along with the EPC in every inventory response, eliminating the need for separate TID read operations and improving throughput.
          properties:
            enabled:
              type: boolean
              description: Enable or disable the FastID feature.
          required:
          - enabled
        tagProtect:
          description: 'Impinj TagProtect prevents unauthorized cloning and reading of tags using a password-based protection mechanism. It is a feature that renders a tag invisible to an RFID reader. The tag becomes RF silent and does not respond to Gen2 commands unless the reader first provides the correct 32-bit password. The required fields depend on the action: tagID is required for enableTagProtection/disableTagProtection and must be omitted for enableTagVisibility/disableTagVisibility.'
          oneOf:
          - type: object
            title: Protect or Unprotect Tag
            description: Protect or unprotect a specific tag identified by its EPC.
            properties:
              action:
                type: string
                description: enableTagProtection sets a tag to protected mode; disableTagProtection removes protection from a specific tag.
                enum:
                - enableTagProtection
                - disableTagProtection
              password:
                type: string
                description: 8-character hexadecimal 32-bit password used for tag protection.
                minLength: 8
                maxLength: 8
                pattern: ^[0-9A-Fa-f]{8}$
              tagID:
                type: string
                description: Hexadecimal tagID (EPC) of the target tag.
                pattern: ^[0-9A-Fa-f]+$
              enableShortRange:
                type: boolean
                description: Enables short-range protection mode for higher security.
            required:
            - action
            - password
            - tagID
          - type: object
            title: Enable or Disable Protected Tag Reading
            description: Enable or disable the reader's ability to read protected tags.
            properties:
              action:
                type: string
                description: enableTagVisibility enables the reader to read protected tags; disableTagVisibility disables reading of protected tags.
                enum:
                - enableTagVisibility
                - disableTagVisibility
              password:
                type: string
                description: 8-character hexadecimal 32-bit password used for tag protection.
                minLength: 8
                maxLength: 8
                pattern: ^[0-9A-Fa-f]{8}$
              enableShortRange:
                type: boolean
                description: Enables short-range protection mode for higher security.
            required:
            - action
            - password
        tagFocus:
          type: object
          description: Impinj TagFocus instructs tags that have already been inventoried to remain unresponsive thus enabling the reader to focus on other tags. By reducing tag chatter, TagFocus improves read rates and accuracy in dense tag environments. TagFocus targets tags inventoried in session S1.
          properties:
            enabled:
              type: boolean
              description: Enable or disable the TagFocus feature.
          required:
          - enabled
        tagQuieting:
          $ref: '#/components/schemas/impinjTagQuieting.v1'
    SetImpinjGen2XResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    SetImpinjGen2XResponse422:
      type: object
      properties:
        message:
          type: string
    SetImpinjGen2XResponse500:
      type: object
      properties:
        code:
          type: number
        message:
          type: string
    SetBleConfigRequest:
      type: object
      required:
      - ble
      properties:
        ble:
          type: object
          required:
          - enable
          - scanIntervalSec
          - additionalFilters
          - protocols
          properties:
            enable:
              type: boolean
            scanIntervalSec:
              type: integer
              minimum: 0
              maximum: 300
            additionalFilters:
              type: object
              additionalProperties: false
              properties:
                rssi:
                  type: integer
                  minimum: -127
                  maximum: 0
                serviceUuids16:
                  type: array
                  items:
                    type: string
                    oneOf:
                    - pattern: ^(0[xX])?[0-9A-Fa-f]{4}$
                    - pattern: ^0000[0-9A-Fa-f]{4}-0000-1000-8000-00805[Ff]9[Bb]34[Ff][Bb]$
                serviceUuids128:
                  type: array
                  items:
                    type: string
                    pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$
            protocols:
              type: object
              description: Protocol-specific BLE scanner configurations.
              properties:
                iBeacon:
                  type: object
                  additionalProperties: false
                  required:
                  - enabled
                  properties:
                    enabled:
                      type: boolean
                    filters:
                      type: array
                      items:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          uuid:
                            type: string
                            description: Proximity UUID
                            pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$
                          major:
                            type: integer
                            minimum: 0
                            maximum: 65535
                            description: Major value
                          minor:
                            type: integer
                            minimum: 0
                            maximum: 65535
                            description: Minor value
                          txPower:
                            type: integer
                            minimum: -128
                            maximum: 127
                            description: TX power / calibrated RSSI at 1m
                altBeacon:
                  type: object
                  additionalProperties: false
                  required:
                  - enabled
                  properties:
                    enabled:
                      type: boolean
                    filters:
                      type: array
                      items:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          mfgId:
                            type: string
                            description: Manufacturer ID (hex string)
                            pattern: ^[0-9A-Fa-f]{4}$
                          beaconId:
                            type: string
                            description: Beacon ID (UUID string)
                            pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$
                          major:
                            type: integer
                            description: Major value
                            minimum: 0
                            maximum: 65535
                          minor:
                            type: integer
                            description: Minor value
                            minimum: 0
                            maximum: 65535
                          refRssi:
                            type: integer
                            description: Reference RSSI (TX power at 1m)
                            minimum: -128
                            maximum: 127
                eddystone:
                  type: object
                  additionalProperties: false
                  required:
                  - enabled
                  properties:
                    enabled:
                      type: boolean
                    filters:
                      type: array
                      description: Filter by Eddystone frame fields. Use `frameType` to target a specific frame type (URL, UID, EID). All other fields are optional and frame-type-specific.
                      items:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          frameType:
                            type: string
                            description: Eddystone frame type
                            enum:
                            - URL
                            - UID
                            - EID
                            - TLM
                          txPower:
                            type: integer
                            description: TX power at 0m (calibrated RSSI)
                            minimum: -128
                            maximum: 127
                          url:
                            type: string
                            description: Advertised URL (Eddystone-URL only)
                            pattern: ^https?://
                          namespace:
                            type: string
                            description: 10-byte namespace (Eddystone-UID only, hex string)
                            pattern: ^[0-9A-Fa-f]{20}$
                          instance:
                            type: string
                            description: 6-byte instance ID (Eddystone-UID only, hex string)
                            pattern: ^[0-9A-Fa-f]{12}$
                          ephemeralId:
                            type: string
                            description: 8-byte ephemeral ID (Eddystone-EID only, hex string)
                            pattern: ^[0-9A-Fa-f]{16}$
                generic:
                  type: object
                  additionalProperties: false
                  description: Configuration for GENERIC_BLE beacons. Filters match on device-level advertisement fields like address, addressType, name and alias.
                  required:
                  - enabled
                  properties:
                    enabled:
                      type: boolean
                    filters:
                      type: array
                      description: List of filter objects for GENERIC_BLE beacons. A beacon is forwarded if it matches any one filter entry.
                      items:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          address:
                            type: string
                            description: Bluetooth device address to match (e.g. "7E:41:25:1E:D5:16").
                            pattern: ^[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){5}$
                          addressType:
                            type: string
                            description: Bluetooth address type to match.
                            enum:
                            - public
                            - random
                          name:
                            type: string
                            minLength: 1
                            description: Device name to match against the advertisement name field.
                          alias:
                            type: string
                            minLength: 1
                            description: Device alias to match against the advertisement alias field.
