  /cloud/version:
    get:
      tags:
        - System
      summary: Retrieves reader component version information
      description: |
        ## Description

        The `GET /cloud/version` REST endpoint retrieves detailed hardware and software component version information from the reader's software stack.

        This endpoint returns:

        - Reader application, radio firmware, and cloud agent versions
        - Radio control application version
        - Reader model and serial number
        - Available OS upgrade paths (`availableOsUpgrades`; empty when none)
        - Firmware revert information (`revertBackFirmware`)

        No request body is required.

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `get_version` |
        | Pattern Name | Version Query |
        | REST Endpoint | `GET /cloud/version` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Supported Operations | Retrieve firmware, model, serial number, and upgrade details |

        ## When to Use This Endpoint

        Use `GET /cloud/version` to:

        - Confirm the installed firmware versions before or after a system update
        - Verify the exact reader model when applying model-specific configuration
        - Capture the serial number for asset tracking, remote fleet management, or support cases
        - Audit whether a downloaded OS upgrade is waiting (`availableOsUpgrades`)

        Key fields to check in the response:

        | Field | What to Check | Why It Matters |
        |---|---|---|
        | `readerApplication` | Current reader software version | Determines which features and API operations are available. |
        | `radioFirmware` | Firmware running on the radio module | Affects RF behavior, read performance, and hardware compatibility. |
        | `cloudAgentApplication` | Cloud agent version | Governs device-to-cloud messaging behavior and cloud connectivity. |
        | `model` | `FXR90`, `FX7500`, `FX9600`, `ATR7000`, or `FXR60` | Drives physical capabilities and model-specific settings. |
        | `serialNumber` | Unique reader serial number | Identifies the device for support cases and asset records. |
        | `availableOsUpgrades` | Is the object empty or populated? | A populated object means a downloaded OS upgrade is ready to install. An empty object `{}` means none is waiting. |
        | `revertBackFirmware` | Object | Versions available for reverting the reader firmware. |
      operationId: getVersion
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVersionResponse"
              example:
                availableOsUpgrades: {}
                cloudAgentApplication: 0.6.2.64
                model: FXR60
                radioControlApplication: 0.2.58.7
                radioFirmware: 2.1.70.0
                readerApplication: 5.0.7
                revertBackFirmware: {}
                serialNumber: "260975251E0049"
      security:
        - bearerAuth: []
  /cloud/status:
    get:
      tags:
        - System
      summary: Retrieves reader operational statistics
      description: |
        ## Description

        The `GET /cloud/status` REST endpoint retrieves operational statistics and health information from the reader at the moment of the request.

        This endpoint returns:

        - Uptime and current system time
        - Radio connection and activity state
        - Reader temperature
        - CPU and RAM usage
        - Flash storage usage by partition
        - Antenna port connection states
        - NTP synchronization status
        - Cloud interface connection status
        - Power source and power-negotiation state
        - Active Impinj Gen2X feature status (when a Gen2X feature is running)
        - BLE scanner runtime status (scan state, scan start time, and beacon counts by protocol)

        The `ble` section is present only when BLE is supported and its status is available. No request body is required.

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `get_status` |
        | Pattern Name | Reader Status Query |
        | REST Endpoint | `GET /cloud/status` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Supported Operations | Retrieve live operational statistics and health |

        ## When to Use This Endpoint

        Use `GET /cloud/status` to:

        - Confirm the reader is powered, healthy, and reachable
        - Verify the radio is connected before starting inventory
        - Monitor reader temperature for thermal issues
        - Synchronize against the reader's current system time
        - Check CPU, RAM, and flash usage during high-load scenarios
        - Confirm BLE scanning is active and review beacon counts by protocol

        Key fields to check in the response:

        | Field | What to Check | Why It Matters |
        |---|---|---|
        | `uptime` | How long has the reader been running? | Long uptimes confirm stability; short uptimes indicate an unexpected restart. |
        | `radioConnection` | Is the value `connected`? | Inventory cannot run if the radio is disconnected. |
        | `radioActivity` | Is it `active` or `inactive`? | Confirms whether an inventory session is currently in progress. |
        | `temperature` | Is the value within safe operating range? | Excessive temperature can cause throttling or hardware faults. |
        | `antennas` | Are expected ports `connected`? | A `disconnected` antenna port means tags on that port will not be read. |
        | `ntp.offset` | Is the offset near zero? | A large NTP offset means event timestamps may be inaccurate. |
        | `ble.scanState` | Is the scan running? | Confirms whether the BLE scanner is currently active (`running`) or `stopped`. |
        | `ble.scanStartTime` | When did the current scan start? | ISO 8601 timestamp marking when BLE scanning last started. |
        | `ble.beaconCounts` | Are advertisements being seen? | Per-protocol counts (`iBeacon`, `altBeacon`, `eddystone`, `generic`, `total`) confirm beacons are being detected in the current scan window. |
        | `impinjGen2X.feature` | Which Gen2X feature is active (`fastID`, `tagProtect`, `tagFocus`, `tagQuieting`, or `none`)? | Names the currently running feature. `none` when Gen2X is not running. |
        | `impinjGen2X.isActive` | Is a Gen2X feature running in this inventory session? | These two fields show the runtime state of Gen2X. When Gen2X is running, `feature` names the running feature and `isActive` is `true`. When it is not running, `feature` is `none` and `isActive` is `false`. Use `GET /cloud/impinjGen2X` to read the saved configuration. |

        ## BLE Status Fields

        When BLE is supported and active, the response includes a `ble` object:

        | Field | Type | Description |
        |---|---|---|
        | `ble.scanState` | string | Current BLE scanner state — `running` or `stopped`. |
        | `ble.scanStartTime` | string (date-time) | ISO 8601 timestamp of when the BLE scan was last started. |
        | `ble.beaconCounts.total` | integer | Total BLE advertisements observed in the current scan window. |
        | `ble.beaconCounts.iBeacon` | integer | Number of iBeacon advertisements observed. |
        | `ble.beaconCounts.altBeacon` | integer | Number of AltBeacon advertisements observed. |
        | `ble.beaconCounts.eddystone` | integer | Number of Eddystone advertisements observed. |
        | `ble.beaconCounts.generic` | integer | Number of generic BLE advertisements observed. |

        Example `ble` section:

        ```json
        "ble": {
          "scanState": "running",
          "scanStartTime": "2026-05-21T13:46:16.955Z",
          "beaconCounts": {
            "total": 108,
            "iBeacon": 75,
            "altBeacon": 33,
            "eddystone": 0,
            "generic": 0
          }
        }
        ```
      operationId: getStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStatusResponse"
              example:
                antennas:
                  "1": connected
                  "2": disconnected
                  "3": disconnected
                  "4": disconnected
                  "5": connected
                  "6": connected
                ble:
                  beaconCounts:
                    altBeacon: 0
                    eddystone: 0
                    generic: 0
                    iBeacon: 0
                    total: 0
                  scanStartTime: ''
                  scanState: stopped
                cpu:
                  system: 0
                  user: 19
                flash:
