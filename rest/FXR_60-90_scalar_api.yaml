                  properties:
                    apn:
                      type: string
                    preferredNetworkType:
                      type: string
                    enableIPv6:
                      type: boolean
                    enablePin:
                      type: boolean
                    enableRoaming:
                      type: boolean
                    currentDataClass:
                      type: string
                    highestAvailableDataClass:
                      type: string
                    currentServiceProvider:
                      type: string
                    registerState:
                      type: string
                    packetServiceState:
                      type: string
                    internetAccess:
                      type: boolean
                    simState:
                      type: string
                    signalBar:
                      type: number
                    rssi:
                      type: string
                    rsrp:
                      type: string
                    rsrq:
                      type: string
                    snr:
                      type: string
                Status:
                  type: string
                isEnabled:
                  type: boolean
                macAddress:
                  type: string
            uap0:
              type: object
              description: WiFi Hotspot (Access Point) interface.
              properties:
                ssid:
                  type: string
