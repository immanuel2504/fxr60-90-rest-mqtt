      summary: Reader Login
      description: |
        ## Description

        The `GET /cloud/localRestLogin` endpoint authenticates with the reader and returns a Bearer token for subsequent API requests.

        This endpoint returns:

        - `code` — `0` on success
        - `message` — the bearer token

        No request body.

        Send the token as `Authorization: Bearer <token>` on other REST calls.

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | REST Endpoint | `GET /cloud/localRestLogin` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | HTTP Basic Auth (admin reader credentials) |

        ## Before You Begin

        Use HTTP Basic Auth with the reader admin username and password. In the API docs viewer, enter the credentials in the **Authorize** dialog and click **Authorize** before calling this endpoint.
      operationId: localrestlogin
