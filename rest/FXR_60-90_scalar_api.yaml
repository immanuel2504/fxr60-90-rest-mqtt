  /cloud/ntpServer:
    get:
      tags:
        - Date&Time
      summary: Retrieve the NTP server
      description: |
        ## Description

        The `GET /cloud/ntpServer` REST endpoint retrieves the NTP server used for time synchronization.

        This endpoint returns:

        - `server` — hostname or IP of the primary NTP server

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `get_ntpServer` |
        | Pattern Name | NTP Server Query |
        | REST Endpoint | `GET /cloud/ntpServer` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Supported Operations | Retrieve the configured NTP server |

        ## When to Use This Endpoint

        Use `GET /cloud/ntpServer` to:

        - Read `server` after `PUT /cloud/ntpServer`
      operationId: getNtpServer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetNtpServerResponse"
              examples:
                ntp_server:
                  summary: ntp server
                  value:
                    server: pool.ntp.org
                pool_ntp_org:
                  summary: server pool.ntp.org
                  value:
                    server: pool.ntp.org
      security:
        - bearerAuth: []
    put:
      tags:
        - Date&Time
      summary: Set NTP server
      description: |
        ## Description

        The `PUT /cloud/ntpServer` REST endpoint sets the NTP server used for time synchronization.

        This endpoint requires one primary:

        - `server` — hostname or IP
        - or `server1` — same meaning (legacy key)

        Optional:

        - `server2` — backup hostname or IP

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `set_ntpServer` |
        | Pattern Name | NTP Server Configuration |
        | REST Endpoint | `PUT /cloud/ntpServer` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Content-Type | `application/json` |
        | Required Request Fields | `server` or `server1` |

        ## Before You Begin

        Decide the NTP host to send. Use the JSON field names below.

        | Field | What to set |
        |---|---|
        | `server` | Primary NTP hostname or IP. |
        | `server1` | Same as `server` (legacy key). Send `server` or `server1`, not both. |
        | `server2` | Optional backup hostname or IP. |
      operationId: updateNtpServer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNtpServerRequest"
            examples:
              ntpServer:
                summary: ntpServer
                value:
                  server: time1.google.com
                  server2: time2.google.com
              ntpServer_legacy:
                summary: ntpServer legacy
                value:
                  server1: time1.google.com
                  server2: time2.google.com
              ntpServer_single:
                summary: ntpServer single
                value:
                  server: time.google.com
              server1:
                summary: Legacy server1
                value:
                  server1: time.cloudflare.com
              time1_time2:
                summary: server and server2
                value:
                  server: time1.google.com
                  server2: time2.google.com
              time_google:
                summary: server only
                value:
                  server: time.google.com
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateNtpServerResponse"
              example: ''
      security:
        - bearerAuth: []
