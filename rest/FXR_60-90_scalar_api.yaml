  /cloud/impinjGen2X:
    get:
      tags:
        - ImpinjGen2X
      summary: Get Impinj Gen2X configuration
      description: |
        ## Description

        The `GET /cloud/impinjGen2X` REST endpoint retrieves the Impinj Gen2X configuration currently saved on the reader.

        This endpoint returns the **last saved** Gen2X feature — exactly one of FastID, TagFocus, TagProtect, or TagQuieting — and that feature's fields.

        PUT is wholesale, not a merge. A later PUT replaces the stored object. GET never returns two features at once, and it is not a full picture of radio Gen2X state. Use `GET /cloud/status` `impinjGen2X.isActive` to see whether a saved config is running on the current inventory session.

        On a reader that has **never** had Gen2X configured, GET returns HTTP 200 with an empty body (not JSON `{}`). After any successful PUT, GET returns a JSON object. That saved config is sticky: `PUT /cloud/impinjGen2X` with `{}` is rejected (422). There is no documented way back to the empty body.

        No request body is required.

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `get_impinjGen2X` |
        | Pattern Name | Impinj Gen2X Configuration Query |
        | REST Endpoint | `GET /cloud/impinjGen2X` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Supported Operations | Retrieve last saved Impinj Gen2X feature |

        ## When to Use This Endpoint

        Use `GET /cloud/impinjGen2X` to:

        - See which one feature was last saved, and its fields (including `enabled`)
        - Confirm the effect of a prior `PUT /cloud/impinjGen2X` call
        - Review that saved object before applying it with `PUT /cloud/start` and `applyImpinjGen2X: true`

        Key fields to check in the response:

        | Field | What to Check | Why It Matters |
        |---|---|---|
        | `fastID` | Was FastID the last PUT? Is `enabled` true or false? | FastID embeds the TID in the singulation response. GET shows only this object if it was the last PUT. |
        | `tagFocus` | Was TagFocus the last PUT? | TagFocus reduces re-reading of already-singulated tags. A later FastID PUT removes this object from GET. |
        | `tagQuieting` | Was TagQuieting the last PUT? | TagQuieting suppresses listed or masked tags. GET shows only the last saved quieting object. |
        | `tagProtect` | Was TagProtect the last PUT? | TagProtect applies Impinj tag locking. GET shows only this object if it was the last PUT. |
      operationId: getImpinjGen2X
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetImpinjGen2XResponse"
              examples:
                empty:
                  summary: empty
                  value: {}
                fastID_configured:
                  summary: Last saved FastID, enabled true
                  value:
                    fastID:
                      enabled: true
                fastID_disabled:
                  summary: Last saved FastID, enabled false
                  value:
                    fastID:
                      enabled: false
                tagFocus_configured:
                  summary: Last saved TagFocus
                  value:
                    tagFocus:
                      enabled: true
                tagProtect_configured:
                  summary: Last saved TagProtect
                  value:
                    tagProtect:
                      action: enableTagProtection
                      enableShortRange: false
                      password: A1B2C3D4
                      tagID: "333311112222333344445555"
                tagQuieting_advanced_configured:
                  summary: Last saved advanced TagQuieting
                  value:
                    tagQuieting:
                      advanced:
                        preSelect:
                          - target: SL
                            action: ASSERTSL_NOTHING
                            mask:
                              bank: EPC
                              pointer: 32
                              length: 96
                              value: E280123456789012345678AB
                          - target: S2
                            action: INVB_INVA
                            mask:
                              bank: EPC
                              pointer: 32
                              length: 96
                              value: E280AABBCCDDEEFF11223344
                        tagQuietMasks:
                          - SL_ASSERT
                          - S2B
                        target: SL
                        stateAwareAction: ASSERTSL_DEASSERTSL
                tagQuieting_basic_configured:
                  summary: Last saved basic TagQuieting
                  value:
                    tagQuieting:
                      basic:
                        action: quiet
                        tagIDs:
                          - e2801191a5030069073b426d
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetImpinjGen2XResponse500"
      security:
        - bearerAuth: []
    put:
      tags:
        - ImpinjGen2X
      summary: Set Impinj Gen2X configuration
      description: |
        ## Description

        The `PUT /cloud/impinjGen2X` REST endpoint configures Impinj Gen2X proprietary RFID features on the reader.

        This endpoint allows you to configure:

        - FastID tag TID embedding through `fastID`
        - Tag protection and visibility control through `tagProtect`
        - TagFocus session suppression through `tagFocus`
        - Tag quieting (basic or advanced) through `tagQuieting`

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `set_impinjGen2X` |
        | Pattern Name | Impinj Gen2X Configuration |
        | REST Endpoint | `PUT /cloud/impinjGen2X` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Content-Type | `application/json` |
        | Success Response | `200 OK` |
        | Error Responses | `422 Unprocessable Entity`, `500 Internal Server Error` |
        | Supported Features | `fastID`, `tagProtect`, `tagFocus`, `tagQuieting` |
        | Supported TagProtect Actions | `enableTagProtection`, `disableTagProtection`, `enableTagVisibility`, `disableTagVisibility` |
        | Supported TagQuieting Modes | `basic` (quiet/unquiet by EPC list), `advanced` (pre-select with mask) |
        | Supported TagQuieting Basic Actions | `quiet`, `unquiet` |
        | Supported Gen2 Memory Banks | EPC, TID, USER, RESERVED |
        | Supported Select Targets | S0, S1, S2, S3, SL |
        | Supported Tag Quiet Masks | S0A, S0B, S2A, S2B, S3A, S3B, SL_ASSERT, SL_DEASSERT |
        | Mutually Exclusive Features | `fastID`, `tagProtect`, `tagFocus`, `tagQuieting` (exactly one feature object per request) |

        ## Before You Begin

        Decide which Gen2X feature to configure before sending this request. Send **exactly one** of `fastID`, `tagProtect`, `tagFocus`, or `tagQuieting`. An empty body or any combination of two or more features is rejected. To apply the saved configuration during inventory, send `PUT /cloud/start` with `applyImpinjGen2X: true`.

        ### Access Password for TagProtect

        `PUT /cloud/impinjGen2X` does **not** write a password onto the tag. `tagProtect.password` must be the 32-bit Access Password already stored in the tag's Gen2 `RESERVED` bank (words 2–3).

        To store a password on the tag:

        1. `PUT /cloud/mode` — WRITE 8 hex characters to `RESERVED` at `wordPointer: 2`. Add a `filter` for that tag's EPC so other tags are not written.
        2. `PUT /cloud/start` — inventory must run for the write to take effect.
        3. `PUT /cloud/impinjGen2X` — send the same 8 characters in `tagProtect.password`.

        Do not use `00000000` — Gen2 treats that as no password, so Protected Mode cannot apply. A password mismatch still returns HTTP 200 and leaves the tag unprotected.

        | What You Need | Details |
        |---|---|
        | Feature selection | Exactly one of `fastID`, `tagProtect`, `tagFocus`, or `tagQuieting` per request. An empty body or two features together is rejected. `tagProtect` cannot be combined with the others. |
        | FastID | Decide whether to enable or disable TID embedding. |
        | TagProtect action | Choose one of: `enableTagProtection` (protect a specific tag), `disableTagProtection` (remove protection from a tag), `enableTagVisibility` (allow reading protected tags), `disableTagVisibility` (block reading protected tags). |
        | TagProtect password | Exactly 8 hex characters. Must match the Access Password already on the tag (`RESERVED` words 2–3). Not `00000000`. TagProtect does not create this password — write it first with `PUT /cloud/mode`. A mismatch returns 200 and does not protect the tag. |
        | TagProtect tag EPC | `tagID` (hex EPC) is required for `enableTagProtection` and `disableTagProtection`. It must be omitted for `enableTagVisibility` and `disableTagVisibility`. |
        | TagFocus | Whether to enable or disable the feature. TagFocus targets session S1. |
        | TagQuieting | For basic: provide `action` (`quiet`/`unquiet`) and the `tagIDs` EPC array (maximum 31 tag IDs per request). For advanced: provide the `preSelect` array, `tagQuietMasks`, `target`, and `stateAwareAction`. |
        | Inventory state | Configure Gen2X before starting inventory. Stop any active inventory first with `PUT /cloud/stop`. |
        | Activation | PUT only saves the configuration. Start with `applyImpinjGen2X: true` to apply it. |

        ## Choosing a Gen2X Feature

        The Gen2X feature you select determines the reader's behavior during inventory. Choose based on your operational goal.

        | Feature | Description | Scope |
        |---|---|---|
        | `fastID` | Returns the EPC and TID together in a single read, eliminating the need for a separate TID read. Best for applications that require chip-level identity (anti-counterfeit, authentication). | Reader-scoped |
        | `tagProtect` | Password-protects individual tags or controls reader visibility of protected tags. Use for securing sensitive items or restricting access. | Tag-scoped |
        | `tagFocus` | Silences already-read tags so the reader focuses only on new tags entering the field. Ideal for portal and conveyor applications. | Reader-scoped |
        | `tagQuieting` (basic) | Silences a specific list of tag EPCs from being reported during inventory. Use when you know exactly which tags to suppress. | Reader-scoped |
        | `tagQuieting` (advanced) | Uses Gen2 select pre-conditions (mask + state-aware action) to silence tags based on memory content or session state. Use for complex filtering in dense environments. | Reader-scoped |

        > Mutually exclusive: only one of `fastID`, `tagProtect`, `tagFocus`, or `tagQuieting` per request. Combining any two returns HTTP 422.

        ## Choosing TagProtect Actions

        TagProtect operations either lock/unlock individual tags or temporarily allow the reader to see already-protected tags. Each action has specific field requirements.

        | Action | What It Does | Required Fields | Key Constraints |
        |---|---|---|---|
        | `enableTagProtection` | Permanently protects a tag; the tag becomes invisible to standard reads until unprotected. Protection lives on the tag, not in reader filtering. | `password`, `tagID` | `password` must match the tag Access Password (8 hex, not `00000000`). Optional `enableShortRange` reduces read range during protection. If omitted, the reader stores `false`. A wrong password still returns 200 and the tag stays visible. |
        | `disableTagProtection` | Removes protection from a previously protected tag, restoring normal visibility. | `password`, `tagID` | `password` must match the tag's existing access password exactly. |
        | `enableTagVisibility` | Temporarily allows the reader to read protected tags during this session. Does not change the tag's protection state. | `password` | Reader-scoped; affects all protected tags in field. |
        | `disableTagVisibility` | Restores the default behavior where protected tags are hidden from the reader. | `password` | Reverts the effect of `enableTagVisibility`. |

        > Important: `enableTagProtection` and `disableTagProtection` are tag-specific (require `tagID`). `enableTagVisibility` and `disableTagVisibility` are reader-wide visibility toggles.

        ## Choosing TagQuieting Strategy

        TagQuieting silences tags from being reported during inventory. Choose between **basic** (EPC-list based) and **advanced** (Gen2 select mask based) depending on your filtering complexity.

        ### Basic TagQuieting

        | Field | What It Controls |
        |---|---|
        | `action: quiet` | Silences the listed tags from being reported in future inventories. |
        | `action: unquiet` | Intended to restore reporting for listed tags. Quieting is session-scoped; starting without `applyImpinjGen2X` is what makes a quieted tag visible again. |
        | `tagIDs` | Array of EPCs (hex strings) to quiet or unquiet. Maximum **31 EPCs** per request. |

        ### Advanced TagQuieting

        Advanced quieting uses Gen2 select pre-conditions to silence tags based on memory content and state, instead of explicit EPC lists.

        | Field | What It Controls |
        |---|---|
        | `preSelect[]` | Array of Gen2 select operations applied **before** quieting. Each entry contains `target`, `action`, and `mask`. |
        | `preSelect[].target` | The session flag or SL to act upon (`S0`, `S1`, `S2`, `S3`, `SL`). |
        | `preSelect[].action` | The state-aware action to take on match/mismatch. SL targets use ASSERTSL / DEASSERTSL / NEGATESL pairs (e.g., `ASSERTSL_NOTHING`, `NEGATESL_NOTHING`). Session targets use INVA / INVB / FLIPAB pairs (e.g., `INVB_INVA`, `FLIPAB_NOTHING`). |
        | `preSelect[].mask` | The memory mask: `bank` (EPC/TID/USER/RESERVED), `pointer` (bit offset), `length` (bits), `value` (hex). |
        | `tagQuietMasks` | Array of session-flag combinations defining the quieted state (`S0A`, `S2B`, `SL_ASSERT`, `SL_DEASSERT`, etc.). |
        | `target` | The target session/flag used for the actual quieting operation. |
        | `stateAwareAction` | Same enum as `preSelect[].action` (e.g., `ASSERTSL_DEASSERTSL`, `DEASSERTSL_ASSERTSL`, `NEGATESL_NOTHING`, `FLIPAB_NOTHING`). |

        > Important: Use `basic` when you have a discrete list of EPCs. Use `advanced` when filtering by memory content, session state, or complex multi-step Gen2 select conditions.

        ## Choosing FastID and TagFocus

        `fastID` and `tagFocus` each use an `enabled` flag. Neither can be sent in the same request as any other Gen2X feature.

        ### `fastID`

        | Field | What It Controls |
        |---|---|
        | `enabled: true` | On Gen2X-capable tags, inventory events use `format: "fastID"` and `idHex` is 48 hex characters (24 EPC + 24 TID). There is no separate `tid` field. Non-Gen2X tags stay `format: "epc"` with EPC-only `idHex`. |
        | `enabled: false` | Standard EPC-only reads (`format: "epc"`). |

        **Use FastID when:** Your application needs TID for every tag (e.g., authentication, chip-level traceability) and you want to avoid the extra round-trip of a separate TID read. Parse `idHex` by length, or key off `format == "fastID"`. A client that treats `idHex` as always the EPC will read a 48-character value as one long EPC.

        ### `tagFocus`

        | Field | What It Controls |
        |---|---|
        | `enabled: true` | Once a tag is read, it is silenced for the rest of the inventory cycle. The reader focuses only on new tags entering the field. TagFocus targets session S1. |
        | `enabled: false` | Standard inventory behavior; tags can be reported multiple times. |

        To measure TagFocus, set `reportFilter.duration` to `0` on the mode. The reader's default report filter de-duplicates to one event per tag, which hides the repeat-read drop.

        **Use TagFocus when:** You operate portals, conveyors, or other scenarios with many duplicate reads of the same tag set and want unique-tag reporting.

        ## Applying the Configuration

        Calling this endpoint only **saves** the configuration on the reader; it is not active until inventory is started with the activation flag.

        ### REST Workflow

        ```text
        PUT  /cloud/stop                 -> stop any active inventory
        PUT  /cloud/impinjGen2X          -> save the configuration
        GET  /cloud/impinjGen2X          -> verify the saved configuration
        PUT  /cloud/start                -> body: { "applyImpinjGen2X": true }
        ```

        ### Request Format

        Every request to this endpoint follows this structure:

        ```http
        PUT /cloud/impinjGen2X HTTP/1.1
        Host: <reader-address>
        Authorization: Bearer <token>
        Content-Type: application/json

        {
          // exactly one Gen2X feature object
        }
        ```

        ### Success Response (`200 OK`)

        ```http
        HTTP/1.1 200 OK
        Content-Type: application/json

        {
          "message": "Success: Gen2X configured. Use applyImpinjGen2X flag in start command to apply features."
        }
        ```

        ### Error Responses

        | Status Code | Meaning | When It Occurs |
        |---|---|---|
        | `422 Unprocessable Entity` | Validation error | Empty body, mutually exclusive features sent together, invalid enum value, or constraint violation. |
        | `500 Internal Server Error` | Reader-side failure | Internal reader error while persisting the configuration. |
      operationId: setImpinjGen2X
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetImpinjGen2XRequest"
            examples:
              advanced_quiet_tags:
                summary: Advanced quiet tags
                value:
                  tagQuieting:
                    advanced:
                      preSelect:
                        - target: SL
                          action: ASSERTSL_NOTHING
                          mask:
                            bank: EPC
                            pointer: 32
                            length: 96
                            value: E280123456789012345678AB
                        - target: S2
                          action: INVB_INVA
                          mask:
                            bank: EPC
                            pointer: 32
                            length: 96
                            value: E280AABBCCDDEEFF11223344
                      tagQuietMasks:
                        - SL_ASSERT
                        - S2B
                      target: SL
                      stateAwareAction: ASSERTSL_DEASSERTSL
              advanced_unquiet_tags:
                summary: Advanced unquiet tags
                value:
                  tagQuieting:
                    advanced:
                      preSelect:
                        - target: SL
                          action: DEASSERTSL_NOTHING
                          mask:
                            bank: EPC
                            pointer: 32
                            length: 96
                            value: E280123456789012345678AB
                        - target: S2
                          action: INVA_INVB
                          mask:
                            bank: EPC
                            pointer: 32
                            length: 96
                            value: E280AABBCCDDEEFF11223344
                      tagQuietMasks:
                        - SL_DEASSERT
                        - S2A
                      target: SL
                      stateAwareAction: DEASSERTSL_ASSERTSL
              disable_fastID:
                summary: Disable FastID
                value:
                  fastID:
                    enabled: false
              disable_protect_read:
                summary: Disable protected-tag visibility
                value:
                  tagProtect:
                    action: disableTagVisibility
                    password: "77777777"
              disable_tagFocus:
                summary: Disable TagFocus
                value:
                  tagFocus:
                    enabled: false
              enable_fastID:
                summary: Enable FastID
                value:
                  fastID:
                    enabled: true
              enable_protect_read:
                summary: Enable protected-tag visibility
                value:
                  tagProtect:
                    action: enableTagVisibility
                    password: "77777777"
              enable_tagFocus:
                summary: Enable TagFocus
                value:
                  tagFocus:
                    enabled: true
              protect_tag:
                summary: Protect tag
                value:
                  tagProtect:
