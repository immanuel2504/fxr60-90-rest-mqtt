  /cloud/displayConfig:
    get:
      tags:
        - Display
      summary: Retrieves display configuration
      description: |
        ## Description

        > **FXR60 only.** Display APIs are not available on FXR90.

        The `GET /cloud/displayConfig` REST endpoint retrieves the active display configuration.

        This endpoint returns:

        - `enable` — whether the display is on
        - `enableOnscreenKeyboard` — whether the on-screen keyboard is on
        - `startUrl` — URL loaded on the display
        - `resolution` — active resolution (`WidthxHeight`)
        - `screenTimeoutSec` — idle timeout in seconds
        - `orientation` — `landscape`, `portrait`, `landscape-flipped`, or `portrait-flipped`
        - `keyboardLayout` — `English-US`, `English-UK`, `German`, `Spanish`, `Italian`, `French`, `Brazilian`, `Swedish`, or `Japanese`

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `get_displayConfig` |
        | Pattern Name | Display Configuration Query |
        | REST Endpoint | `GET /cloud/displayConfig` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Supported Operations | Retrieve active display configuration |

        ## When to Use This Endpoint

        Use `GET /cloud/displayConfig` to:

        - Read the settings last applied with `PUT /cloud/displayConfig`
        - Confirm enable, URL, resolution, orientation, and keyboard layout
      operationId: getDisplayConfig
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDisplayConfigResponse"
              example:
                enable: true
                enableOnscreenKeyboard: true
                keyboardLayout: English-US
                orientation: landscape
                resolution: 1920x1080
                screenTimeoutSec: 0
                startUrl: https://localhost/
      security:
        - bearerAuth: []
    put:
      tags:
        - Display
      summary: Sets display configuration
      description: |
        ## Description

        > **FXR60 only.** Display APIs are not available on FXR90.

        The `PUT /cloud/displayConfig` REST endpoint sets the display configuration.

        This endpoint sends:

        - `enable` — `true` turns the display on, `false` turns it off
        - `enableOnscreenKeyboard` — on-screen keyboard
        - `startUrl` — URL opened when the display is enabled
        - `resolution` — `WidthxHeight`
        - `screenTimeoutSec` — idle timeout in seconds (`0` keeps the screen on; maximum `3600`)
        - `orientation` — `landscape`, `portrait`, `landscape-flipped`, or `portrait-flipped`
        - `keyboardLayout` — `English-US`, `English-UK`, `German`, `Spanish`, `Italian`, `French`, `Brazilian`, `Swedish`, or `Japanese`

        Omitted fields keep their current values.

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `set_displayConfig` |
        | Pattern Name | Display Configuration |
        | REST Endpoint | `PUT /cloud/displayConfig` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Content-Type | `application/json` |

        ## Before You Begin

        Decide the display settings to send. Use the JSON field names below.

        | Field | What to set |
        |---|---|
        | `enable` | `true` to turn the display on, `false` to turn it off. |
        | `enableOnscreenKeyboard` | `true` to show the on-screen keyboard, `false` to hide it. |
        | `startUrl` | Page the display opens, for example `https://localhost/`. |
        | `resolution` | Size as `WidthxHeight`, for example `1920x1080`. Use `GET /cloud/inputOutputDevices` to see supported modes. |
        | `screenTimeoutSec` | Idle time in seconds before the screen sleeps. `0` keeps it on. Maximum `3600`. |
        | `orientation` | `landscape`, `portrait`, `landscape-flipped`, or `portrait-flipped`. |
        | `keyboardLayout` | `English-US`, `English-UK`, `German`, `Spanish`, `Italian`, `French`, `Brazilian`, `Swedish`, or `Japanese`. |
      operationId: setDisplayConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDisplayConfigRequest"
            examples:
              display_config:
                summary: display config
                value:
                  enable: true
                  enableOnscreenKeyboard: true
                  startUrl: https://localhost/
                  resolution: 1920x1080
                  orientation: landscape
                  screenTimeoutSec: 300
                  keyboardLayout: Japanese
              flipped_orientation:
                summary: Enable and flip orientation
                value:
                  enable: true
                  orientation: landscape-flipped
              landscape_japanese:
                summary: Landscape, Japanese, 1920x1080
                value:
                  enable: true
                  enableOnscreenKeyboard: true
                  startUrl: https://localhost/
                  resolution: 1920x1080
                  orientation: landscape
                  screenTimeoutSec: 300
                  keyboardLayout: Japanese
              portrait_german:
                summary: Portrait, German, 1280x720
                value:
                  enable: true
                  enableOnscreenKeyboard: false
                  startUrl: https://10.117.229.18/
                  resolution: 1280x720
                  orientation: portrait
                  screenTimeoutSec: 0
                  keyboardLayout: German
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetDisplayConfigResponse"
              example: {}
      security:
        - bearerAuth: []
  /cloud/inputOutputDevices:
    get:
      tags:
        - Display
      summary: Retrieves input/output device information
      description: |
        ## Description

        > **FXR60 only.** Display APIs are not available on FXR90.

        The `GET /cloud/inputOutputDevices` REST endpoint retrieves the connection status and capabilities of devices attached to the reader.

        This endpoint returns:

        - Connection status for the attached keyboard, mouse, touch panel, and monitor
        - The active keyboard layout
        - Monitor hardware details, current and supported resolutions, orientation, and whether the panel is awake

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `get_inputOutputDevices` |
        | Pattern Name | Input/Output Devices Query |
        | REST Endpoint | `GET /cloud/inputOutputDevices` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Supported Operations | Retrieve attached keyboard, mouse, touch, and monitor status |

        ## When to Use This Endpoint

        Use `GET /cloud/inputOutputDevices` to:

        - Confirm which peripherals are connected
        - Read `supportedResolutions` before `PUT /cloud/displayConfig`
        - Check whether the panel is awake (`screenActive`)
      operationId: getInputOutputDevices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetInputOutputDevicesResponse"
              example:
                keyboard:
                  keyboardLayout: English-US
                  status: disconnected
                monitor:
                  details:
                    - currentResolution: 1920x1080
                      manufacturer: MST
                      model: XENARC
                      orientation: landscape
                      screenActive: true
                      supportedResolutions:
                        - 1280x720
                        - 1920x1080
                        - 1024x768
                        - 800x600
                        - 720x576
                        - 720x480
                        - 640x480
                  status: connected
                mouse:
                  status: disconnected
                touch:
                  status: disconnected
      security:
        - bearerAuth: []
  /cloud/app-led:
    get:
      tags:
        - App-led
      summary: Retrieves application LED state
      description: |
        ## Description

        The `GET /cloud/app-led` REST endpoint retrieves whether the application LED is under reader control or has been set by an application.

        This endpoint returns:

        - `status` — `DEFAULT` means the LED reflects the reader's normal LED status (reader-controlled). `NON_DEFAULT` means a prior `PUT /cloud/app-led` set the LED to an explicit color, flash, and duration, overriding the normal status.

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `get_appled` |
        | Pattern Name | Application LED Query |
        | REST Endpoint | `GET /cloud/app-led` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Supported Operations | Retrieve application LED status |
        | Response field | `status`: `DEFAULT` \| `NON_DEFAULT` |

        ## When to Use This Endpoint

        Use `GET /cloud/app-led` to:

        - Check whether the LED is `DEFAULT` or `NON_DEFAULT`
        - Confirm that a prior `PUT /cloud/app-led` moved the LED out of `DEFAULT`
      operationId: getAppled
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAppledResponse"
              examples:
                default_state:
                  summary: Reader controls LED
                  value:
                    status: DEFAULT
                non_default_state:
                  summary: App controls LED
                  value:
                    status: NON_DEFAULT
                overridden_state:
                  summary: overridden state
                  value:
                    status: NON_DEFAULT
      security:
        - bearerAuth: []
    put:
      tags:
        - App-led
      summary: Updates application LED state
      description: |
        ## Description

        The `PUT /cloud/app-led` REST endpoint sets the application LED color, flash, and duration.

        This endpoint requires:

        - `color` — `red`, `amber`, `green`, or `off`
        - `flash` — `true` to blink, `false` for solid
        - `seconds` — how long to keep this state. `0` means until the next `PUT /cloud/app-led`

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `set_appled` |
        | Pattern Name | Application LED Control |
        | REST Endpoint | `PUT /cloud/app-led` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Content-Type | `application/json` |
        | Supported Colors | `red`, `amber`, `green`, `off` |
        | Required Request Fields | `color`, `flash`, `seconds` |

        ## Before You Begin

        | What You Need | Details |
        |---|---|
        | Color | `red`, `amber`, `green`, or `off`. |
        | Flash | `true` blinks. `false` is solid. |
        | Duration | Seconds to keep this state. Use `0` until the next `PUT /cloud/app-led`. |
      operationId: setAppled
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAppledRequest"
            examples:
              amber_flash_60s:
                summary: Amber flash 60 seconds
                value:
                  color: amber
                  flash: true
                  seconds: 60
              app_led:
                summary: app led
                value:
                  color: amber
                  flash: true
                  seconds: 60
              continuous_alarm:
                summary: continuous alarm
                value:
                  color: red
                  flash: true
                  seconds: 0
              green_solid_10s:
                summary: Green solid 10 seconds
                value:
                  color: green
                  flash: false
                  seconds: 10
              "off":
                summary: LED off
                value:
                  color: "off"
                  flash: false
                  seconds: 0
              red_flash_indefinite:
                summary: Red flash indefinite
                value:
                  color: red
                  flash: true
                  seconds: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetAppledResponse"
              example: ''
      security:
        - bearerAuth: []
  /cloud/stack-led:
    get:
      tags:
        - Stack-led
      summary: Retrieves stack LED state
      description: |
        ## Description

        > **FXR60 Premium only.** The stack LED is not on other FXR60 variants. The FXR90 has no stack light.

        The `GET /cloud/stack-led` REST endpoint retrieves the current stack LED state.

        This endpoint returns:

        - `status` — `DEFAULT` or `NON_DEFAULT`
        - `color`, `brightness`, `flash`, `seconds`, and `seconds_remaining` when the LED is `NON_DEFAULT`

        When `status` is `DEFAULT`, the body is `{ "status": "DEFAULT" }`.

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `get_stackled` |
        | Pattern Name | Stack LED Query |
        | REST Endpoint | `GET /cloud/stack-led` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 Premium |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Supported Operations | Retrieve stack LED state |

        ## When to Use This Endpoint

        Use `GET /cloud/stack-led` to:

        - Read `status`, color, brightness, and flash
        - Check `seconds_remaining` on a timed override
        - Confirm a prior `PUT /cloud/stack-led` call
      operationId: getStackled
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetStackledResponse"
              examples:
                default_state:
                  summary: Reader controls LED
                  value:
                    status: DEFAULT
                flashing_red_with_countdown:
                  summary: flashing red with countdown
                  value:
                    status: NON_DEFAULT
                    color: red
                    brightness: high
                    flash: true
                    seconds: 30
                    seconds_remaining: 18
                green_med_solid:
                  summary: Green, med, solid
                  value:
                    status: NON_DEFAULT
                    color: green
                    brightness: med
                    flash: false
                    seconds: 0
                    seconds_remaining: 0
                red_flash_countdown:
                  summary: Red flash with countdown
                  value:
                    status: NON_DEFAULT
                    color: red
                    brightness: high
                    flash: true
                    seconds: 30
                    seconds_remaining: 18
                solid_green:
                  summary: solid green
                  value:
                    status: NON_DEFAULT
                    color: green
                    brightness: med
                    flash: false
                    seconds: 0
                    seconds_remaining: 0
      security:
        - bearerAuth: []
    put:
      tags:
        - Stack-led
      summary: Updates stack LED state
      description: |
        ## Description

        > **FXR60 Premium only.** The stack LED is not on other FXR60 variants. The FXR90 has no stack light.

        The `PUT /cloud/stack-led` REST endpoint sets the stack LED color, flash, and duration.

        This endpoint requires:

        - `color` — `red`, `amber`, `green`, `blue`, or `off`
        - `flash` — `true` to blink, `false` for solid
        - `seconds` — how long to keep this state. `0` means until the next `PUT /cloud/stack-led`

        `brightness` is optional: `low`, `med`, or `high`. If omitted, the reader uses `low`.

        `blue` is valid on the stack LED. It is not valid on `PUT /cloud/app-led`.

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `set_stackled` |
        | Pattern Name | Stack LED Control |
        | REST Endpoint | `PUT /cloud/stack-led` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 Premium |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Content-Type | `application/json` |
        | Supported Colors | `red`, `amber`, `green`, `blue`, `off` |
        | Supported Brightness | `low`, `med`, `high` (default `low`) |
        | Required Request Fields | `color`, `flash`, `seconds` |

        ## Before You Begin

        | What You Need | Details |
        |---|---|
        | Color | `red`, `amber`, `green`, `blue`, or `off`. |
        | Flash | `true` blinks. `false` is solid. |
        | Duration | Seconds to keep this state. Use `0` until the next `PUT /cloud/stack-led`. |
        | Brightness | Optional. `low`, `med`, or `high`. |
      operationId: setStackled
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetStackledRequest"
            examples:
              amber_med_flash:
                summary: Amber, med, flashing
                value:
                  color: amber
                  brightness: med
                  flash: true
                  seconds: 15
              green_solid:
                summary: Green solid
                value:
                  color: green
                  flash: false
                  seconds: 0
              red_high_alert:
                summary: red high alert
                value:
                  color: red
                  brightness: high
                  flash: true
                  seconds: 30
              red_high_flash:
                summary: Red, high, flashing
                value:
                  color: red
                  brightness: high
                  flash: true
                  seconds: 30
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetStackledResponse"
      security:
        - bearerAuth: []
  /cloud/gpo:
    get:
      tags:
        - Gpio
      summary: Retrieves the GPO status
      description: |
        ## Description

        The `GET /cloud/gpo` REST endpoint retrieves the current output state of each GPO pin.

        This endpoint returns:

        - `1`, `2`, `3`, `4` — `HIGH` or `LOW`

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `get_gpoStatus` |
        | Pattern Name | GPO Status Query |
        | REST Endpoint | `GET /cloud/gpo` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Supported Operations | Retrieve GPO pin states |

        ## When to Use This Endpoint

        Use `GET /cloud/gpo` to:

        - Read pin states before or after `PUT /cloud/gpo`
      operationId: getGpoStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetGpoStatusResponse"
              example:
                "1": LOW
                "2": LOW
                "3": LOW
                "4": LOW
      security:
        - bearerAuth: []
    put:
      tags:
        - Gpio
      summary: Updates GPO port state
      description: |
        ## Description

        The `PUT /cloud/gpo` REST endpoint sets one GPO pin.

        This endpoint requires:

        - `port` — pin number `1`, `2`, `3`, or `4`
        - `state` — `true` for HIGH, `false` for LOW

        One pin per request.

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `set_gpo` |
        | Pattern Name | GPO Control |
        | REST Endpoint | `PUT /cloud/gpo` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Content-Type | `application/json` |
        | Required Request Fields | `port`, `state` |

        ## Before You Begin

        Decide the pin and the state to send. Use the JSON field names below.

        | Field | What to set |
        |---|---|
        | `port` | Pin to drive: `1`, `2`, `3`, or `4`. |
        | `state` | `true` for HIGH, `false` for LOW. |
      operationId: setGpo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGpoRequest"
            example:
              port: 3
              state: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetGpoResponse"
              example: ''
      security:
        - bearerAuth: []
  /cloud/gpi:
