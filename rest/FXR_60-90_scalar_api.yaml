  "/cloud/apps/{appname}/autostart":
    put:
      tags:
        - userapp
      summary: Autostart user application
      description: |
        ## Description

        The `PUT /cloud/apps/{appname}/autostart` REST endpoint sets whether a user application starts when the reader boots.

        This endpoint requires:

        - `{appname}` — installed name in the URL
        - `autostart` — `true` or `false`

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `set_autostartUserapp` |
        | Pattern Name | User Application Autostart Configuration |
        | REST Endpoint | `PUT /cloud/apps/{appname}/autostart` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Content-Type | `application/json` |
        | Path Parameter | `appname` |
        | Required Request Fields | `autostart` |

        ## Before You Begin

        Decide the boot behavior. Use the JSON field names below.

        | Field | What to set |
        |---|---|
        | `appname` | Installed name from `GET /cloud/apps`. URL path. |
        | `autostart` | `true` to start on boot, or `false` to not. |
      operationId: setAutostartuserapp
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAutostartuserappRequest"
            examples:
              autostart_false:
                summary: autostart false
                value:
                  appname: mylogger
                  autostart: false
              autostart_true:
                summary: autostart true
                value:
                  appname: mylogger
                  autostart: true
              autostartUserapp-false:
                summary: autostartUserapp-false
                value:
                  appname: mylogger
                  autostart: false
              autostartUserapp:
                summary: autostartUserapp
                value:
                  appname: mylogger
                  autostart: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetAutostartuserappResponse"
              example: ''
      security:
        - bearerAuth: []
    parameters:
      - name: appname
        in: path
        required: true
        schema:
          type: string
  /cloud/apps:
