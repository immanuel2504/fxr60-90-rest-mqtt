  /cloud/eSimConfig:
    get:
      tags:
        - Network
      summary: Gets the eSIM configuration
      description: |
        ## Description

        The `GET /cloud/eSimConfig` REST endpoint retrieves eSIM identity and profiles.

        This endpoint returns:

        - `eid`
        - `imei`
        - `profiles` — `profileNickName`, `provider`, `iccid`, `enabled`

        Supported on FXR90 only.

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `get_eSimConfig` |
        | Pattern Name | eSIM Configuration Query |
        | REST Endpoint | `GET /cloud/eSimConfig` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Supported Operations | Retrieve eSIM identity and profiles |

        ## When to Use This Endpoint

        Use `GET /cloud/eSimConfig` to:

        - Read `eid`, `imei`, and `profiles` after `PUT /cloud/eSimConfig`
      operationId: getEsimConfig
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEsimConfigResponse"
              examples:
                gnd1_gnd2:
                  summary: Profiles gnd1 and gnd2
                  value:
                    eid: "89049032005008882600033489161010"
                    imei: "356938035643809"
                    profiles:
                      - enabled: true
                        iccid: "8991101200003204510"
                        profileNickName: gnd1
                        provider: Airtel
                      - enabled: false
                        iccid: "8944501012345678903"
                        profileNickName: gnd2
                        provider: Vodafone
                profiles_present:
                  summary: profiles present
                  value:
                    eid: "89049032005008882600033489161010"
                    imei: "356938035643809"
                    profiles:
                      - enabled: true
                        iccid: "8991101200003204510"
                        profileNickName: gnd1
                        provider: Airtel
                      - enabled: false
                        iccid: "8944501012345678903"
                        profileNickName: gnd2
                        provider: Vodafone
      security:
        - bearerAuth: []
    put:
      tags:
        - Network
      summary: Sets the eSIM configuration
      description: |
        ## Description

        The `PUT /cloud/eSimConfig` REST endpoint updates an eSIM profile.

        This endpoint requires:

        - `operation` — `add`, `delete`, `enable`, or `disable`
        - `profileNickName`

        Also send `activationID` when `operation` is `add`. Omit it for `enable`, `disable`, and `delete`.

        Supported on FXR90 only.

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `set_eSimConfig` |
        | Pattern Name | eSIM Configuration |
        | REST Endpoint | `PUT /cloud/eSimConfig` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Content-Type | `application/json` |
        | Required Request Fields | `operation`, `profileNickName` |

        ## Before You Begin

        Decide the operation and profile. Use the JSON field names below.

        | Field | What to set |
        |---|---|
        | `operation` | `add`, `delete`, `enable`, or `disable`. |
        | `profileNickName` | Profile nickname from `GET /cloud/eSimConfig`. |
        | `activationID` | Required for `add`. Omit for `enable`, `disable`, and `delete`. |
      operationId: setEsimConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetEsimConfigRequest"
            examples:
              add_profile:
                summary: operation add with activationID
                value:
                  operation: add
                  profileNickName: gnd1
                  activationID: LPA:1$RSP.GSMA.COM$ABCDEF1234567890
              delete_profile:
                summary: operation delete
                value:
                  operation: delete
                  profileNickName: gnd1
              disable_profile:
                summary: operation disable
                value:
                  operation: disable
                  profileNickName: gnd1
              enable_profile:
                summary: operation enable
                value:
                  operation: enable
                  profileNickName: gnd1
              eSimConfig_add:
