                  GPIO-LED:
                    GPODefaults:
                      "1": LOW
                      "2": LOW
                      "3": LOW
                      "4": LOW
                    LEDDefaults:
                      "1": GREEN
                      "2": GREEN
                      "3": GREEN
                    CLOUD_CONNECT:
                      - type: GPO
                        pin: 1
                        state: HIGH
                      - type: LED
                        led: 2
                        color: GREEN
                    CLOUD_DISCONNECT:
                      - type: GPO
                        pin: 2
                        state: HIGH
                      - type: LED
                        led: 2
                        color: RED
                    RADIO_START:
                      - type: GPO
                        pin: 3
                        state: HIGH
                    RADIO_STOP:
                      - type: GPO
                        pin: 3
                        state: LOW
                    TAG_READ:
                      - type: GPO
                        pin: 4
                        state: HIGH
