    put:
      tags:
        - Region
      summary: Update region information
      description: |
        ## Description

        The `PUT /cloud/region` REST endpoint sets the RF region and regulatory standard.

        This endpoint requires:

        - `country` — exact name from `GET /cloud/supportedRegionList`
        - `standardname` — exact name from `GET /cloud/supportedStandardList`

        Optional:

        - `isLBT` — `true` or `false`, when `isLBTConfigurable` is `"true"`
        - `channeldata` — frequencies in kHz, when `isChannelSelectable` is `"true"`

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `set_region` |
        | Pattern Name | Region Configuration |
        | REST Endpoint | `PUT /cloud/region` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Content-Type | `application/json` |
        | Required Request Fields | `country`, `standardname` |

        ## Before You Begin

        Take `country` and `standardname` from this reader's lists. Use the JSON field names below.

        | Field | What to set |
        |---|---|
        | `country` | Exact string from `GET /cloud/supportedRegionList`. |
        | `standardname` | Exact string from `GET /cloud/supportedStandardList`. |
        | `isLBT` | Optional. `true` or `false` when `isLBTConfigurable` is `"true"`. |
        | `channeldata` | Optional. Frequencies in kHz when `isChannelSelectable` is `"true"`. |
      operationId: setRegion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRegionRequest"
            examples:
              region:
                summary: region
                value:
                  country: Canada
                  standardname: CANADA_FCC_15
              us_fcc_15:
                summary: United States/Canada, US_FCC_15
                value:
                  country: United States/Canada
                  standardname: US_FCC_15
              us_fcc_a:
                summary: United States/Canada, US_FCC_A
                value:
                  country: United States/Canada
                  standardname: US_FCC_A
              us_fcc_c:
                summary: United States/Canada, US_FCC_C
                value:
                  country: United States/Canada
                  standardname: US_FCC_C
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetRegionResponse"
              example: ''
      security:
        - bearerAuth: []
  /cloud/supportedRegionList:
    get:
      tags:
        - Region
      summary: Retrieves the supported region list based on the reader type
      description: |
        ## Description

        The `GET /cloud/supportedRegionList` REST endpoint retrieves the country names this reader accepts.

        This endpoint returns:

        - `SupportedRegions` — country or region names for `PUT /cloud/region` `country`

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `get_supportedRegionList` |
        | Pattern Name | Supported Region Query |
        | REST Endpoint | `GET /cloud/supportedRegionList` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Supported Operations | Retrieve permitted country names |

        ## When to Use This Endpoint

        Use `GET /cloud/supportedRegionList` to:

        - Get the exact `country` string before `PUT /cloud/region`
        - Get the `region` value for `GET /cloud/supportedStandardList`
      operationId: getSupportedregionlist
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSupportedregionlistResponse"
              examples:
                inline:
                  summary: inline
                  value:
                    SupportedRegions:
                      - United States/Canada
                united_states_canada:
                  summary: United States/Canada
                  value:
                    SupportedRegions:
                      - United States/Canada
      security:
        - bearerAuth: []
  /cloud/supportedStandardList:
    get:
      tags:
        - Region
      summary: Retrieves the standard channels of the supported regions
      description: |
        ## Description

        The `GET /cloud/supportedStandardList` REST endpoint retrieves the regulatory standards for a country.

        Send `region` — a country name from `GET /cloud/supportedRegionList`.

        This endpoint returns:

        - `StandardName` — standard identifier (in `SupportedStandards[]`)
        - `channeldata` — channel frequencies in kHz
        - `isChannelSelectable` — `"true"` or `"false"`
        - `isHoppingConfigurable` — `"true"` or `"false"`
        - `isLBTConfigurable` — `"true"` or `"false"`

        ## Endpoint Details

        | Property | Value |
        |---|---|
        | MQTT Command | `get_supportedStandardList` |
        | Pattern Name | Supported Standard Query |
        | REST Endpoint | `GET /cloud/supportedStandardList` |
        | Communication Type | Client to Device (HTTP request/response) |
        | Applies To | FXR60 / FXR90 |
        | Authentication | Bearer token (`Authorization: Bearer <token>`) |
        | Supported Operations | Retrieve standards and channel details for a country |

        ## When to Use This Endpoint

        Use `GET /cloud/supportedStandardList` to:

        - Get the exact `standardname` string before `PUT /cloud/region`
        - See whether LBT or channel selection can be set for that standard
      operationId: getSupportedstandardlist
      parameters:
